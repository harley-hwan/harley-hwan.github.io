<text x="704" y="334" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">소프트웨어가 결정한다</text>
<rect x="34" y="340" width="792" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="364" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">PESA 는 전력을 한곳에서 만들어 나눈다. 송신관 하나가 죽으면 레이다가 죽는다.</text>
<text x="54" y="383" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">AESA 는 소자마다 증폭한다. 고장이 점진적이고, 소자별 진폭·위상을 자유롭게 줄 수 있다.</text>
<text x="54" y="402" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">디지털은 부배열까지 내려온 뒤 ADC 를 둔다. 받은 데이터를 여러 번 다르게 합성할 수 있다.</text>
<text x="54" y="421" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">한 번 받아 여러 빔을 동시에 만든다는 것 — 그 하나가 자원 관리의 제약을 통째로 바꾼다.</text>
