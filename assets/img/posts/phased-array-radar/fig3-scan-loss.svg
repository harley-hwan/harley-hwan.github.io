<text x="486.64" y="217.689" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">이득 [dB]  (cos^1.3)</text>
<text x="621" y="292" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">조향각 θ₀</text>
<rect x="34" y="306" width="792" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="330" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">조향각에서 본 개구는 D·cos θ₀ 로 줄어든다. 빔폭은 1/cos θ₀ 배, 이득은 cos θ₀ 배다.</text>
<text x="54" y="349" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">60° 에서 빔폭 2.03° → 4.06°, 이득 −3.0 dB. 소자 패턴까지 넣으면 −3.9 dB 쯤 된다.</text>
<text x="54" y="368" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">R⁴ ∝ G² 이므로 R ∝ √G — 60° 방향 탐지거리는 정면의 0.71 배(소자 패턴까지 넣으면 0.64 배)다.</text>
<text x="54" y="387" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">한 면으로 ±60° 가 한계인 이유이고, 전 방위를 보려면 3~4 면을 세워야 하는 이유다.</text>
<text x="54" y="406" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">스캔 손실은 자원 관리에도 들어온다 — 가장자리 빔은 dwell 을 더 줘야 같은 성능이 나온다.</text>
</svg>
