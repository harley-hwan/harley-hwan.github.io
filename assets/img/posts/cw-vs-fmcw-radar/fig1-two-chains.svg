<text x="70" y="513.5" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600">속도 · 채널 간 위상차 → 각도</text>
<rect x="524" y="486" width="280" height="46" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<rect x="524" y="492" width="4.5" height="34" rx="2" fill="#16a34a"/>
<text x="538" y="513.5" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600">거리 · 속도 · 각도</text>
