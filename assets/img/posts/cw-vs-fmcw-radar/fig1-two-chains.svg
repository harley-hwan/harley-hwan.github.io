<text x="196" y="133" font-size="14.5" fill="#2563eb" text-anchor="middle" font-weight="700">CW — 접지 않는다</text>
<text x="664" y="133" font-size="14.5" fill="#ea580c" text-anchor="middle" font-weight="700">FMCW — 접는다</text>
<rect x="56" y="146" width="280" height="46" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
<rect x="56" y="152" width="4.5" height="34" rx="2" fill="#2563eb"/>
