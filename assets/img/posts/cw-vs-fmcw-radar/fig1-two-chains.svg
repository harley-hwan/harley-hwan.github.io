<text x="70" y="184" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">정지물이 전부 0 Hz에 쌓인다</text>
<rect x="524" y="146" width="280" height="46" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
<rect x="524" y="152" width="4.5" height="34" rx="2" fill="#ea580c"/>
