<text x="74" y="354" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">67 − 2 × 2 × 15.625 = 4.5</text>
<text x="74" y="373" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">같은 범위를 덮으려면  T_c ≤ λ / (4 × 67) = 46.6 µs — fast-chirp에서 무리한 값은 아니지만, 그 설계를 따로 사야 한다.</text>
