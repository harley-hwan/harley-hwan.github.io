<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="b-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="b-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="858" height="498" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="30" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">계통도 — 같은 신호가 블록마다 어떤 모양과 세기가 되는가</text>
<text x="430" y="50" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">C 밴드 기준 시스템(P_t 1.5 MW, G 45 dBi, σ 0.1 m²)으로 100 km 표적을 볼 때의 실제 값이다.</text>

<rect x="40" y="64" width="762" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="46" y="60" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="700">그 지점에서 신호의 모양</text>

<text x="94" y="80" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">낮은 전력의 펄스</text>
<line x1="52" y1="114" x2="136" y2="114" stroke="#cbd5e1" stroke-width="1"/>
<path d="M76,114 L76,104 L96,104 L96,114" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M116,114 L116,108 L126,108 L126,114" fill="none" stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="3 2"/>

<text x="208" y="80" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">모양 그대로, 진폭만 크게</text>
<line x1="166" y1="114" x2="250" y2="114" stroke="#cbd5e1" stroke-width="1"/>
<path d="M190,114 L190,90 L210,90 L210,114" fill="none" stroke="#2563eb" stroke-width="2.4"/>

<text x="322" y="80" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">공간으로 퍼져 나간다</text>
<g fill="none" stroke="#0284c7" stroke-width="1.8">
<path d="M300,96 A22,22 0 0 1 300,132"/><path d="M310,92 A30,30 0 0 1 310,136"/><path d="M320,88 A38,38 0 0 1 320,140"/>
</g>

<text x="421" y="80" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="700">가는 길·오는 길 두 번 퍼진다</text>
<circle cx="421" cy="106" r="9" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
<text x="421" y="128" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">표적</text>

<text x="520" y="80" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">잡음에 거의 묻혀 있다</text>
<polyline points="478,110 482,107 486,113 490,108 494,111 498,106 502,110 506,108 510,105 514,101 518,98 522,101 526,105 530,108 534,113 538,107 542,110 546,106 550,112 554,108 558,110 562,107" fill="none" stroke="#16a34a" stroke-width="1.6"/>

<text x="634" y="80" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">복소 표본 열이 된다</text>
<polyline points="592,110 596,107 600,113 604,108 608,111 612,106 616,110 620,108 624,105 628,101 632,98 636,101 640,105 644,108 648,113 652,107 656,110 660,106 664,112 668,108 672,110 676,107" fill="none" stroke="#16a34a" stroke-width="1.2" opacity="0.55"/>
<g fill="#15803d">
<circle cx="600" cy="113" r="2.2"/><circle cx="608" cy="111" r="2.2"/><circle cx="616" cy="110" r="2.2"/><circle cx="624" cy="105" r="2.2"/><circle cx="632" cy="98" r="2.2"/><circle cx="640" cy="105" r="2.2"/><circle cx="648" cy="113" r="2.2"/><circle cx="656" cy="110" r="2.2"/><circle cx="664" cy="112" r="2.2"/><circle cx="672" cy="110" r="2.2"/>
</g>

<text x="748" y="80" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">문턱 위로 솟아야 검출</text>
<line x1="706" y1="102" x2="790" y2="102" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 3"/>
<polyline points="706,114 712,111 718,115 724,110 730,113 736,109 742,111 748,88 754,111 760,114 766,109 772,115 778,110 784,113 790,110" fill="none" stroke="#16a34a" stroke-width="1.8"/>

<rect x="44" y="138" width="100" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="94" y="159" font-size="12.5" fill="#1e40af" text-anchor="middle" font-weight="700">파형 발생</text>
<text x="94" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">τ 와 PRF 를 정한다</text>

<rect x="158" y="138" width="100" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="208" y="159" font-size="12.5" fill="#1e40af" text-anchor="middle" font-weight="700">송신기</text>
<text x="208" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">전력을 여기서 만든다</text>

<rect x="272" y="138" width="100" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="322" y="159" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">듀플렉서 · 안테나</text>
<text x="322" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">시간으로 갈라 쓴다</text>

<line x1="144" y1="163" x2="156" y2="163" stroke="#1e293b" stroke-width="1.8" marker-end="url(#b-dark)"/>
<line x1="258" y1="163" x2="270" y2="163" stroke="#1e293b" stroke-width="1.8" marker-end="url(#b-dark)"/>
<line x1="374" y1="155" x2="410" y2="155" stroke="#0284c7" stroke-width="1.8" marker-end="url(#b-dark)"/>
<line x1="432" y1="172" x2="468" y2="172" stroke="#dc2626" stroke-width="1.8" marker-end="url(#b-red)"/>

<rect x="470" y="138" width="100" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="520" y="159" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="700">저잡음 증폭기</text>
<text x="520" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">잡음지수를 정한다</text>

<rect x="584" y="138" width="100" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="634" y="159" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">하향 변환 · ADC</text>
<text x="634" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">여기부터 디지털</text>

<rect x="698" y="138" width="100" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="748" y="159" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">신호 처리 · 검출</text>
<text x="748" y="176" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">문턱을 넘는지 본다</text>

<line x1="570" y1="163" x2="582" y2="163" stroke="#1e293b" stroke-width="1.8" marker-end="url(#b-dark)"/>
<line x1="684" y1="163" x2="696" y2="163" stroke="#1e293b" stroke-width="1.8" marker-end="url(#b-dark)"/>

<text x="46" y="208" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="700">그 지점에서 신호의 세기 [dBm]</text>
<g stroke="#eef2f7" stroke-width="1.1">
<line x1="80" y1="212" x2="802" y2="212"/><line x1="80" y1="243.8" x2="802" y2="243.8"/>
<line x1="80" y1="275.6" x2="802" y2="275.6"/><line x1="80" y1="307.5" x2="802" y2="307.5"/>
<line x1="80" y1="339.3" x2="802" y2="339.3"/>
</g>
<line x1="80" y1="212" x2="80" y2="352" stroke="#94a3b8" stroke-width="1.4"/>
<g font-size="9.5" fill="#94a3b8" text-anchor="end">
<text x="75" y="215">+100</text><text x="75" y="247">+50</text><text x="75" y="279">0</text><text x="75" y="311">−50</text><text x="75" y="343">−100</text>
</g>

<polyline points="94,282 208,217.3 322,217.3" fill="none" stroke="#2563eb" stroke-width="2.6"/>
<line x1="322" y1="217.3" x2="470" y2="330.8" stroke="#dc2626" stroke-width="2.6"/>
<polyline points="470,330.8 520,330.8 634,330.8 748,330.8" fill="none" stroke="#16a34a" stroke-width="2.6"/>
<g fill="#1e293b">
<circle cx="94" cy="282" r="3.6"/><circle cx="208" cy="217.3" r="3.6"/><circle cx="322" cy="217.3" r="3.6"/>
<circle cx="520" cy="330.8" r="3.6"/><circle cx="748" cy="330.8" r="3.6"/>
</g>
<text x="94" y="274" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="700">−10</text>
<text x="265" y="210" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">+91.8 dBm (1.5 MW)</text>
<text x="392" y="258" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">−178.4 dB</text>
<text x="392" y="275" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400">왕복 R⁴ 이 만든 낙차</text>
<text x="500" y="350" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">−86.6 dBm</text>

<line x1="470" y1="341.8" x2="802" y2="341.8" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="798" y="337" font-size="10" fill="#94a3b8" text-anchor="end" font-weight="700">잡음 바닥 −104.0 dBm</text>

<rect x="556" y="222" width="248" height="82" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="568" y="242" font-size="11.5" fill="#15803d" text-anchor="start" font-weight="700">수신 쪽만 확대하면</text>
<text x="568" y="261" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">에코 −86.6 − 잡음 −104.0 = 여유 17.4 dB</text>
<text x="568" y="279" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">손실 6 dB 를 빼면 SNR 11.3 dB 가 남는다</text>
<text x="568" y="297" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">문턱 13 dB 에 못 미친다 — 100 km 는 한계 밖</text>
<line x1="672" y1="304" x2="700" y2="326" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="3 3"/>

<rect x="56" y="372" width="748" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="394" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">이 그림이 말하는 것</text>
<text x="74" y="416" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">· 송신 첨두와 수신 에코의 차이가 178 dB 다. 듀플렉서는 그 두 신호를 같은 안테나에서 시간으로 갈라 준다.</text>
<text x="74" y="436" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">· 되돌아온 에코는 잡음 바닥보다 겨우 17 dB 위다. 위 칸에서 신호가 잡음에 묻혀 보이는 것이 그 모습이다.</text>
<text x="74" y="456" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">· 그래서 LNA 앞 케이블 1 dB 가 그대로 이 17 dB 여유에서 빠지고, 탐지거리로는 5.6 % 가 깎인다.</text>
<text x="74" y="476" font-size="11.5" fill="#0284c7" text-anchor="start" font-weight="700">· 블록의 배치가 아니라 이 세기 곡선이 계통도의 내용이다. 어느 블록이 왜 그 자리에 있는지가 곡선에서 나온다.</text>
</svg>
