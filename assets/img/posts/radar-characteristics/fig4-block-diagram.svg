<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 458" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="b-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker><marker id="b-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="1" y="1" width="858" height="456" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">펄스형 레이다 계통도 — 위 줄이 송신, 아래 줄이 수신</text>

<rect x="330" y="58" width="200" height="40" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="430" y="83" font-size="12.5" fill="#6d28d9" text-anchor="middle" font-weight="700">타이밍 · 동기 (거리 0의 원점)</text>
<g stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4">
<line x1="330" y1="78" x2="122" y2="78"/><line x1="122" y1="78" x2="122" y2="128"/>
<line x1="530" y1="78" x2="738" y2="78"/><line x1="738" y1="78" x2="738" y2="290"/>
</g>

<rect x="40" y="112" width="586" height="78" rx="11" fill="none" stroke="#bfdbfe" stroke-width="1.4" stroke-dasharray="5 4"/><text x="46" y="108" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">송신 경로  ▶  왼쪽에서 오른쪽으로</text><rect x="52" y="128" width="140" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="122" y="147" font-size="12.5" fill="#1e40af" text-anchor="middle" font-weight="700">파형 발생 · 변조기</text>
<text x="122" y="164" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">τ, PRF, chirp</text>

<line x1="192" y1="151" x2="234" y2="151" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>

<rect x="236" y="128" width="128" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
<text x="300" y="147" font-size="12.5" fill="#1e40af" text-anchor="middle" font-weight="700">송신기</text>
<text x="300" y="164" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">첨두 kW ~ MW</text>

<line x1="364" y1="151" x2="406" y2="151" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>

<rect x="408" y="118" width="104" height="66" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="460" y="143" font-size="12.5" fill="#b45309" text-anchor="middle" font-weight="700">듀플렉서</text>
<text x="460" y="161" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">송수신 시분할</text>
<text x="460" y="176" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">새면 수신단이 탄다</text>

<line x1="512" y1="151" x2="554" y2="151" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>
<path d="M586,124 Q616,151 586,178" fill="none" stroke="#1e293b" stroke-width="3"/>
<line x1="556" y1="151" x2="588" y2="151" stroke="#1e293b" stroke-width="2.4"/>
<text x="600" y="200" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">안테나</text>
<line x1="628" y1="140" x2="700" y2="118" stroke="#0284c7" stroke-width="2.2" marker-end="url(#b-mute)"/>
<line x1="700" y1="170" x2="628" y2="150" stroke="#dc2626" stroke-width="2.2" marker-end="url(#b-mute)"/>
<text x="716" y="118" font-size="11" fill="#0284c7" text-anchor="start" font-weight="700">송신</text>
<text x="716" y="174" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">에코</text>

<line x1="460" y1="184" x2="460" y2="222" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>

<rect x="40" y="208" width="500" height="78" rx="11" fill="none" stroke="#bbf7d0" stroke-width="1.4" stroke-dasharray="5 4"/><text x="534" y="204" font-size="11.5" fill="#16a34a" text-anchor="end" font-weight="700">수신 경로  ◀  오른쪽에서 왼쪽으로 되돌아온다</text><rect x="396" y="224" width="128" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="460" y="243" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="700">저잡음 증폭기</text>
<text x="460" y="260" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">잡음지수 F 를 혼자 정한다</text>

<line x1="396" y1="247" x2="354" y2="247" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>

<rect x="224" y="224" width="128" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="288" y="243" font-size="12.5" fill="#15803d" text-anchor="middle" font-weight="700">하향 변환 · ADC</text>
<text x="288" y="260" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">I / Q 복소 기저대역</text>

<line x1="224" y1="247" x2="182" y2="247" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>

<rect x="52" y="224" width="128" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="116" y="243" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">신호 처리</text>
<text x="116" y="260" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">압축 · 도플러 · 검출</text>

<line x1="116" y1="270" x2="116" y2="300" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>
<rect x="52" y="302" width="128" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="116" y="321" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">데이터 처리</text>
<text x="116" y="338" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">추적 · 트랙 관리</text>

<line x1="180" y1="325" x2="676" y2="325" stroke="#1e293b" stroke-width="2.2" marker-end="url(#b-dark)"/>
<rect x="678" y="302" width="128" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="742" y="321" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">전시</text>
<text x="742" y="338" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">PPI · A-스코프</text>

<rect x="56" y="366" width="748" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="388" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">예민한 자리는 둘이다 — 듀플렉서가 새면 첫 소자가 타고, LNA 앞의 손실은 그대로 잡음지수에 더해진다.</text>
<text x="74" y="409" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">케이블 1 dB 가 탐지거리 5.6 % 를 깎는다. 위쪽 보라색 점선은 신호가 아니라 타이밍 기준을 나눠 주는 경로다.</text><text x="74" y="429" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">안테나에서 접혀 되돌아오는 모양인 것은 송신과 수신이 같은 안테나를 시간으로 나눠 쓰기 때문이다.</text>
</svg>
