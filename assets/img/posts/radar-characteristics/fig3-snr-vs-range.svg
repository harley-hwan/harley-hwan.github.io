<rect x="56" y="386" width="748" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="410" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">읽는 법 — 세 단계면 된다</text>
<text x="74" y="432" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">① 보고 싶은 거리를 가로축에서 찾는다.    ② 그 위에서 곡선을 읽으면 그때의 SNR 이다.</text>
<text x="74" y="451" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">③ 곡선이 빨간 문턱선(13 dB)과 만나는 가로 위치가 그 조건의 탐지거리다 — 점을 찍고 km 를 적어 두었다.</text>
<text x="74" y="476" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">거리가 2 배 멀어질 때마다 SNR 은 12 dB 씩 떨어진다. 여섯 곡선 모두 이 기울기가 같아 나란하다.</text>
<text x="74" y="497" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">왼쪽은 RCS 10 배가 거리 1.78 배(91 → 162 km), 오른쪽은 송신 전력 3 배가 1.32 배(69 → 91 km)뿐이다. 전력으로 거리를 사는 것이 비싼 이유다.</text>
