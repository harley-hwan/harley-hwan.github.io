<text x="430" y="32" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">멀어지면 SNR 이 얼마나 떨어지고, 어디까지 보이는가</text>
<text x="430" y="52" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">가로축은 로그 눈금이라 25 → 50 → 100 → 200 이 같은 간격이다. 그래서 곡선이 직선으로 펴진다.</text>

