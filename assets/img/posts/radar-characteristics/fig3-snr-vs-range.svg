</g>
<text x="240" y="344" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">거리 [km, 로그축]</text>
<text x="640" y="344" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">거리 [km, 로그축]</text>
<text x="34" y="196" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400" transform="rotate(-90 34 196)">SNR [dB]</text>

