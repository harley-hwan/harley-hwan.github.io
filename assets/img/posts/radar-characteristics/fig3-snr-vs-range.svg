<rect x="56" y="386" width="748" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="408" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">여섯 곡선이 전부 평행하다. 무엇을 바꿔도 기울기는 −40 dB/decade 이고, 설계는 이 직선을 위아래로 옮기는 일이다.</text>
<text x="74" y="427" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">RCS 10 배(10 dB)는 거리 1.78 배 — 90.9 km 가 161.6 km 가 된다.</text>
<text x="74" y="446" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">반면 송신 전력 3 배(4.8 dB)는 거리 1.32 배에 그친다. 오른쪽 세 곡선이 붙어 있는 이유이고, 전력으로 거리를 사는 것이 비싼 이유다.</text>
</svg>
