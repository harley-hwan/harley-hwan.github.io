<svg width="2580" height="1200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect x="1" y="1" width="858" height="398" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">앞 스캔 플롯마다 속도 게이트를 두고, 그 안에 들어온 이번 스캔 플롯과 짝지어 트랙을 만든다</text>
<rect x="40" y="56" width="330" height="310" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="205" y="80" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">1-Point 와 2-Point 개시</text>
<text x="120" y="110" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">1-Point</text>
<path d="M120.0,160.0h0" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
<rect x="111" y="151" width="18" height="18" rx="1.5" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<text x="120" y="195" font-size="10.5" fill="#475569" text-anchor="middle">위치 = 플롯 하나</text>
<text x="120" y="211" font-size="10.5" fill="#475569" text-anchor="middle">속도 = 0 (모른다)</text>
<text x="120" y="227" font-size="10.5" fill="#64748b" text-anchor="middle">바로 시작, 속도 오차 큼</text>
<text x="290" y="110" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">2-Point</text>
<path d="M255.0,170.0h0" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
<circle cx="255" cy="170" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<path d="M315.0,150.0h0" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
<rect x="306" y="141" width="18" height="18" rx="1.5" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<line x1="255" y1="170" x2="315" y2="150" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-orange)"/>
<text x="255" y="190" font-size="9.5" fill="#64748b" text-anchor="middle">앞 스캔</text>
<text x="315" y="134" font-size="9.5" fill="#64748b" text-anchor="middle">이번 스캔</text>
<text x="290" y="211" font-size="10.5" fill="#475569" text-anchor="middle">속도 = 위치 차 ÷ 시간 차</text>
<text x="290" y="227" font-size="10.5" fill="#64748b" text-anchor="middle">한 스캔 늦게 시작</text>
<text x="205" y="270" font-size="10.5" fill="#475569" text-anchor="middle">상태 9 개: 축마다 위치 · 속도 · 가속도</text>
<text x="205" y="288" font-size="10.5" fill="#475569" text-anchor="middle">가속도는 두 점으로 못 구해 0 으로 둔다</text>
<text x="205" y="330" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">여기서는 2-Point 개시를 쓴다</text>
<rect x="400" y="56" width="420" height="310" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="610" y="80" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">속도 게이트로 쌍 고르기</text>
<circle cx="470" cy="170" r="44" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="470" cy="170" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<path d="M496.0,188.0h0" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
<text x="460" y="162" font-size="10" fill="#64748b" text-anchor="end">A</text>
<text x="505" y="192" font-size="10" fill="#1e293b" text-anchor="start">a</text>
<line x1="470" y1="170" x2="496" y2="188" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round"/>
<rect x="488" y="180" width="16" height="16" rx="1.5" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<circle cx="610" cy="178" r="44" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="610" cy="178" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<path d="M690.0,300.0h0" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
<text x="600" y="170" font-size="10" fill="#64748b" text-anchor="end">B</text>
<text x="699" y="304" font-size="10" fill="#1e293b" text-anchor="start">b</text>
<line x1="610" y1="178" x2="690" y2="300" stroke="#dc2626" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/>
<line x1="645" y1="234" x2="655" y2="244" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
<line x1="645" y1="244" x2="655" y2="234" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="740" cy="262" r="44" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="740" cy="262" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.6"/>
<path d="M712.0,240.0h0" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
<text x="750" y="276" font-size="10" fill="#64748b" text-anchor="start">C</text>
<text x="703" y="232" font-size="10" fill="#1e293b" text-anchor="end">c</text>
<line x1="740" y1="262" x2="712" y2="240" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round"/>
<rect x="704" y="232" width="16" height="16" rx="1.5" fill="none" stroke="#ea580c" stroke-width="1.6"/>
<path d="M560.0,300.0h0" fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round"/>
<text x="571" y="304" font-size="10" fill="#1e293b" text-anchor="start">d</text>
<text x="560" y="322" font-size="9.5" fill="#64748b" text-anchor="middle">짝이 없다 : 다음 스캔의 후보로</text>
<text x="600" y="110" font-size="10.5" fill="#475569" text-anchor="middle">반경 = 최대 속도 × 스캔 간격</text>
<text x="610" y="345" font-size="10.5" fill="#475569" text-anchor="middle">게이트 안이면 트랙 (A-a, C-c), 밖이면 버린다 (B-b)</text>
<text x="430" y="386" font-size="10.5" fill="#64748b" text-anchor="middle">○ 앞 스캔 플롯   ● 이번 스캔 플롯   □ 새 트랙 (위치 = 이번 플롯)</text>
</svg>
