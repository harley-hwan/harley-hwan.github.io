<svg width="2580" height="900" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect x="1" y="1" width="858" height="298" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">메시지 하나를 받을 때마다 네 단계를 같은 순서로 밟는다</text>
<rect x="44" y="70" width="180" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="134" y="98" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">① 삭제 트랙 정리</text>
<text x="134" y="126" font-size="10.5" fill="#475569" text-anchor="middle">앞 스캔에서 삭제 상태가 된</text>
<text x="134" y="143" font-size="10.5" fill="#475569" text-anchor="middle">트랙을 표에서 뺀다</text>
<line x1="227" y1="125" x2="239" y2="125" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<rect x="242" y="70" width="180" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="332" y="98" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">② 트랙 관리</text>
<text x="332" y="126" font-size="10.5" fill="#475569" text-anchor="middle">남은 트랙마다 연관 결과를 넣고</text>
<text x="332" y="143" font-size="10.5" fill="#475569" text-anchor="middle">스코어 규칙으로 상태를 바꾼다</text>
<line x1="425" y1="125" x2="437" y2="125" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<rect x="440" y="70" width="180" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="530" y="98" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">③ 2-Point 개시</text>
<text x="530" y="126" font-size="10.5" fill="#475569" text-anchor="middle">앞 · 이번 스캔 플롯 쌍 가운데</text>
<text x="530" y="143" font-size="10.5" fill="#475569" text-anchor="middle">게이트를 지난 쌍으로 새 트랙</text>
<line x1="623" y1="125" x2="635" y2="125" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<rect x="638" y="70" width="180" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="728" y="98" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">④ 후보 보관</text>
<text x="728" y="126" font-size="10.5" fill="#475569" text-anchor="middle">이번 스캔 플롯을 다음 스캔의</text>
<text x="728" y="143" font-size="10.5" fill="#475569" text-anchor="middle">개시 후보로 남긴다 (쓴 플롯 제외)</text>
<text x="430" y="215" font-size="11" fill="#475569" text-anchor="middle">개시가 관리 뒤에 오므로 새로 만든 트랙은 그 스캔에는 점수가 바뀌지 않는다. 다음 스캔부터 ② 를 거친다</text>
<text x="430" y="240" font-size="11" fill="#475569" text-anchor="middle">③ 은 게이트를 지난 쌍이 여럿이면 속력이 작은 쌍부터 고르고, 한 플롯은 한 트랙에만 쓴다</text>
<text x="430" y="280" font-size="10" fill="#64748b" text-anchor="middle">플랫폼이 움직였으면 ① 앞에서 앞 스캔의 후보와 트랙 위치를 새 원점 기준으로 옮긴다. 이번 시나리오는 플랫폼이 정지해 있어 이동량이 0 이다</text>
</svg>
