<path d="M462.1,199.7h0" fill="none" stroke="#dc2626" stroke-width="7.0" stroke-linecap="round"/>
<ellipse cx="727.76" cy="133.51" rx="7" ry="52" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" transform="rotate(-14 727.76 133.51)"/>
<path d="M727.8,133.5h0" fill="none" stroke="#dc2626" stroke-width="7.0" stroke-linecap="round"/>
<text x="246.68" y="295.45" font-size="10.5" fill="#475569" text-anchor="middle">가까운 표적</text>
<text x="462.09" y="259.75" font-size="10.5" fill="#475569" text-anchor="middle">중간 거리</text>
<text x="721.76" y="215.51" font-size="10.5" fill="#475569" text-anchor="middle">먼 표적</text>
<text x="430" y="70" font-size="11" fill="#475569" text-anchor="middle">타원의 긴 쪽은 거리 × 각도 표준편차, 짧은 쪽은 거리 표준편차다</text>
<text x="430" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">같은 표적을 여러 번 재면 플롯이 이 타원 모양으로 흩어진다. 이 흩어짐을 행렬로 적은 것이 측정잡음 공분산 R 이다</text>
