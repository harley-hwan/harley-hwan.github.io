<line x1="60" y1="300" x2="755.46" y2="69.71" stroke="#fdba74" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 4"/>
<line x1="60" y1="300" x2="782.17" y2="176.83" stroke="#fdba74" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 4"/>
<text x="220" y="210" font-size="10" fill="#ea580c" text-anchor="middle" transform="rotate(-20 220 210)">각도 오차의 폭</text>
<ellipse cx="246.68" cy="253.45" rx="7" ry="11.14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" transform="rotate(-14 246.68 253.45)"/>
