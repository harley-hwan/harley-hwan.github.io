<rect x="1" y="1" width="858" height="358" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">거리 오차는 어디서나 같지만 각도 오차는 거리에 곱해져 옆으로 퍼진다</text>
<path d="M60.0,300.0h0" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
