<svg width="2580" height="990" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect x="1" y="1" width="858" height="328" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">플롯을 받아 트랙을 만들고 상태를 관리하는 단계가 이번 장이다</text>
<rect x="50" y="62" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="135" y="86" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">표적 궤적 모의</text>
<text x="135" y="106" font-size="10.5" fill="#475569" text-anchor="middle">시각별 참값</text>
<line x1="223" y1="91" x2="247" y2="91" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<rect x="250" y="62" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="335" y="86" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">플롯 · 클러터 모의</text>
<text x="335" y="106" font-size="10.5" fill="#475569" text-anchor="middle">스캔마다 측정치</text>
<line x1="423" y1="91" x2="447" y2="91" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<rect x="450" y="62" width="170" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="535" y="86" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">트랙 개시 · 관리</text>
<text x="535" y="106" font-size="10.5" fill="#2563eb" text-anchor="middle">이번 장</text>
<line x1="623" y1="91" x2="647" y2="91" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<rect x="650" y="62" width="170" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="735" y="86" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">연관 · 추적 필터</text>
<text x="735" y="106" font-size="10.5" fill="#475569" text-anchor="middle">이번 구현의 범위 밖</text>
<rect x="50" y="150" width="760" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="70" y="170" font-size="11.5" fill="#475569" text-anchor="start" font-weight="700">한 프로그램 안의 두 쓰레드</text>
<rect x="70" y="184" width="300" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="220" y="206" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">송신 쓰레드 (신호처리 역할)</text>
<text x="220" y="228" font-size="10.5" fill="#475569" text-anchor="middle">스캔의 표적 플롯과 클러터를 모아</text>
<text x="220" y="245" font-size="10.5" fill="#475569" text-anchor="middle">방위각 순으로 섞고 ID 를 붙여</text>
<text x="220" y="262" font-size="10.5" fill="#475569" text-anchor="middle">플롯 메시지 하나로 보낸다</text>
<rect x="490" y="184" width="300" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="640" y="206" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">수신 쓰레드 (데이터 처리 역할)</text>
<text x="640" y="228" font-size="10.5" fill="#475569" text-anchor="middle">구좌표를 VC-NED 로 바꾸고</text>
<text x="640" y="245" font-size="10.5" fill="#475569" text-anchor="middle">플롯마다 측정잡음 공분산을 만들고</text>
<text x="640" y="262" font-size="10.5" fill="#475569" text-anchor="middle">트랙을 개시하고 상태를 갱신한다</text>
<line x1="374" y1="234" x2="486" y2="234" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-blue)"/>
<text x="430" y="226" font-size="10" fill="#2563eb" text-anchor="middle">UDP 루프백</text>
<text x="430" y="250" font-size="9.5" fill="#64748b" text-anchor="middle">스캔마다 메시지 1 개</text>
<text x="430" y="318" font-size="11" fill="#475569" text-anchor="middle">받는 쪽은 어느 플롯이 표적이고 어느 것이 클러터인지 모른다. 메시지에 그 정보를 넣지 않았기 때문이다</text>
</svg>
