<svg width="2580" height="1140" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect x="1" y="1" width="858" height="378" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">트랙 상태는 네 가지고, 매 스캔 연관 결과 하나로 옮겨 다닌다</text>
<rect x="85" y="116" width="150" height="68" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="160" y="144" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">1 임시</text>
<text x="160" y="164" font-size="10" fill="#475569" text-anchor="middle">막 개시한 트랙</text>
<rect x="355" y="116" width="150" height="68" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="430" y="144" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">2 확정</text>
<text x="430" y="164" font-size="10" fill="#475569" text-anchor="middle">믿을 만해진 트랙</text>
<rect x="625" y="116" width="150" height="68" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="700" y="144" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">3 메모리</text>
<text x="700" y="164" font-size="10" fill="#475569" text-anchor="middle">놓쳤지만 기다리는 트랙</text>
<rect x="355" y="276" width="150" height="68" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="430" y="304" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">4 삭제</text>
<text x="430" y="324" font-size="10" fill="#475569" text-anchor="middle">다음 스캔에 표에서 빠짐</text>
<line x1="235" y1="136" x2="355" y2="136" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-green)"/>
<text x="295" y="124" font-size="10" fill="#16a34a" text-anchor="middle">성공 +1, 점수 ≥ 5</text>
<path d="M 140,116 C 110,70 210,70 180,116" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-orange)"/>
<text x="160" y="68" font-size="10" fill="#ea580c" text-anchor="middle">성공 +1 · 실패 −1</text>
<path d="M 160,184 C 160,250 300,310 355,310" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-mute)"/>
<text x="252" y="236" font-size="10" fill="#64748b" text-anchor="start">실패 −1, 점수 ≤ 0</text>
<line x1="505" y1="136" x2="625" y2="136" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-violet)"/>
<text x="565" y="124" font-size="10" fill="#7c3aed" text-anchor="middle">실패 → 메모리 +1</text>
<line x1="625" y1="166" x2="505" y2="166" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ar-green)"/>
<text x="565" y="202" font-size="10" fill="#16a34a" text-anchor="middle">성공 → 바로 확정, 메모리 0</text>
<path d="M 680,116 C 650,70 750,70 720,116" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-violet)"/>
<text x="700" y="68" font-size="10" fill="#7c3aed" text-anchor="middle">실패 → 메모리 +1</text>
<path d="M 700,184 C 700,250 560,310 505,310" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-mute)"/>
<text x="716" y="250" font-size="10" fill="#64748b" text-anchor="start">메모리 ≥ 5</text>
<path d="M 410,116 C 380,70 480,70 450,116" fill="none" stroke="#16a34a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-green)"/>
<text x="430" y="68" font-size="10" fill="#16a34a" text-anchor="middle">성공 → 유지</text>
<text x="430" y="364" font-size="10.5" fill="#64748b" text-anchor="middle">연관 성공은 Assigned_Flag 1, 실패는 0 이다. 이번 과제는 연관 기능이 없어 플래그가 늘 0 이라 임시에서 삭제로만 간다</text>
</svg>
