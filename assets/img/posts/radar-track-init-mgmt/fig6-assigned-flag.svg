<text x="430" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">이번 구현에는 이 단계가 없어 플래그가 늘 0 이다. 상태 전이와 9절의 확정 확률은 전부 이 한 비트에 걸려 있다</text>
