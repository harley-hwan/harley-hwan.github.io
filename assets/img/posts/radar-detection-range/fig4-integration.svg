<text x="271.168" y="227.235" font-size="11.3" fill="#16a34a" text-anchor="start" font-weight="700">비코히어런트 · Swerling 2</text>
<rect x="252.168" y="235.87" width="12" height="12" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.2" fill-opacity="0.55"/>
<text x="271.168" y="244.87" font-size="11.3" fill="#2563eb" text-anchor="start" font-weight="700">코히어런트  10 log N</text>
<rect x="252.168" y="253.504" width="12" height="12" rx="3" fill="#ea580c" stroke="#ea580c" stroke-width="1.2" fill-opacity="0.55"/>
<text x="271.168" y="262.504" font-size="11.3" fill="#ea580c" text-anchor="start" font-weight="700">비코히어런트 · 비요동</text>
<rect x="482" y="110" width="322" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="496" y="134" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">코히어런트 26 펄스</text>
<text x="722" y="134" font-size="12.5" fill="#2563eb" text-anchor="end" font-weight="700">14.15 dB</text>
<text x="792" y="134" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400">×1.94</text>
<rect x="482" y="156" width="322" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="496" y="180" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">비코히어런트 26 펄스 (비요동)</text>
<text x="722" y="180" font-size="12.5" fill="#ea580c" text-anchor="end" font-weight="700">10.77 dB</text>
<text x="792" y="180" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400">×1.83</text>
<rect x="482" y="202" width="322" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="496" y="226" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">적분 효율 (26 펄스)</text>
<text x="722" y="226" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="700">0.46</text>
<text x="792" y="226" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400">—</text>
<rect x="482" y="248" width="322" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="496" y="272" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">빔 모양 손실</text>
<text x="722" y="272" font-size="12.5" fill="#dc2626" text-anchor="end" font-weight="700">−1.67 dB</text>
<text x="792" y="272" font-size="11.5" fill="#64748b" text-anchor="end" font-weight="400">×0.91</text>
<text x="482" y="306" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">거리 배수는 개선량의 4 제곱근으로 환산한 값이다.</text>
<rect x="34" y="338" width="792" height="126" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="54" y="362" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">빔폭 0.96°, PRF 1 kHz, 6 rpm 이면 표적이 빔 안에 있는 동안 26 펄스가 맞는다 — n_B = θ_B · PRF / (6 · rpm).</text>
<text x="54" y="381" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">26 개를 크기만 더해도 10.8 dB, 거리로 1.83 배다. 이 한 항이 예산에서 유일하게 거리를 늘려 준다.</text>
<text x="54" y="400" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">대신 그 26 개가 전부 빔 정점에서 오지는 않으므로 1.67 dB 를 되돌려 준다. 이것이 빔 모양 손실이다.</text>
<text x="54" y="422" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">적분 효율은 N 이 커질수록 떨어진다 — N=2 에서 0.90, N=26 에서 0.46, N=100 에서 0.28.</text>
<text x="54" y="442" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">Swerling 2 곡선이 더 가파른 것은 출발점이 21.1 dB 로 나빠서다. 요동이 펄스마다 독립이면 적분이 그 손실을 되찾아 준다.</text>
</svg>
