<rect x="1" y="1" width="858" height="476" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="32" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">적분 — 예산에서 유일하게 거리를 늘려 주는 항</text>
<text x="430" y="52" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">빔이 표적을 스치는 동안 들어온 펄스를 모으면 문턱이 내려간다. 위상을 지키면 정직하게, 크기만 더하면 그보다 덜.</text>
