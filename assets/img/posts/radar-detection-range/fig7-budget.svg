<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="ar-ax" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-mut" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs>
<rect x="1" y="1" width="858" height="528" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="32" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">1 장의 90.9 km 는 실제로 얼마가 되는가</text>
<text x="430" y="52" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">적분 한 항이 거리를 84 % 늘리고, 나머지 항들이 그 이상을 되가져간다. 막대 길이가 그 단계까지의 결과 거리다.</text>
<rect x="34" y="80" width="792" height="338" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="376" y1="106" x2="376" y2="392" stroke="#eef2f7" stroke-width="1.2"/>
<text x="376" y="408" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">0</text>
<line x1="480.444" y1="106" x2="480.444" y2="392" stroke="#eef2f7" stroke-width="1.2"/>
<text x="480.444" y="408" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">50</text>
<line x1="584.889" y1="106" x2="584.889" y2="392" stroke="#eef2f7" stroke-width="1.2"/>
<text x="584.889" y="408" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">100</text>
<line x1="689.333" y1="106" x2="689.333" y2="392" stroke="#eef2f7" stroke-width="1.2"/>
<text x="689.333" y="408" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">150</text>
<line x1="565.88" y1="112" x2="565.88" y2="392" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="572.88" y="120" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">1 장의 90.9 km</text>
<text x="300" y="138" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="700">1 장의 결론 — 자유공간·비요동·단일 펄스</text>
<rect x="376" y="125" width="189.882" height="18" rx="3" fill="#64748b" stroke="#64748b" stroke-width="1.3" fill-opacity="0.2"/>
<text x="573.882" y="138" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="700">90.9 km</text>
<text x="300" y="167" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">필요 SNR 을 정확히 (13 → 13.18 dB)</text>
<text x="366" y="167" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">+0.18 dB</text>
<rect x="376" y="154" width="187.925" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="571.925" y="167" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">90.0 km</text>
<text x="300" y="196" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">빔 통과 26 펄스 비코히어런트 적분</text>
<text x="366" y="196" font-size="10.5" fill="#16a34a" text-anchor="end" font-weight="700">−10.77 dB</text>
<rect x="376" y="183" width="349.329" height="18" rx="3" fill="#16a34a" stroke="#16a34a" stroke-width="1.3" fill-opacity="0.2"/>
<text x="733.329" y="196" font-size="11.5" fill="#16a34a" text-anchor="start" font-weight="700">167.2 km</text>
<text x="300" y="225" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">빔 모양 손실</text>
<text x="366" y="225" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">+1.67 dB</text>
<rect x="376" y="212" width="317.31" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="701.31" y="225" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">151.9 km</text>
<text x="300" y="254" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">표적 요동 (Swerling 1)</text>
<text x="366" y="254" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">+8.28 dB</text>
<rect x="376" y="241" width="197.008" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="581.008" y="254" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">94.3 km</text>
<text x="300" y="283" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">CFAR 손실 (참조 셀 16)</text>
<text x="366" y="283" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">+2.01 dB</text>
<rect x="376" y="270" width="175.483" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="559.483" y="283" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">84.0 km</text>
<text x="300" y="312" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">거리 스트래들 (2 배 오버샘플)</text>
<text x="366" y="312" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">+0.29 dB</text>
<rect x="376" y="299" width="172.578" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="556.578" y="312" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">82.6 km</text>
<text x="300" y="341" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="400">정합필터 Taylor 가중</text>
<text x="366" y="341" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">+0.75 dB</text>
<rect x="376" y="328" width="165.285" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="549.285" y="341" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">79.1 km</text>
<text x="300" y="370" font-size="11.5" fill="#1e293b" text-anchor="end" font-weight="700">대기 감쇠 (왕복 0.0078 dB/km)</text>
<rect x="376" y="357" width="154.654" height="18" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.3" fill-opacity="0.2"/>
<text x="538.654" y="370" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="700">74.0 km</text>
<text x="564" y="408" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400"></text>
<text x="596" y="428" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">탐지거리 [km]</text>
<rect x="34" y="436" width="792" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="54" y="460" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">최종 74.0 km — 자유공간 예측의 81 % 다. 그런데 도중에 167 km 까지 올라갔다가 내려왔다는 것이 요점이다.</text>
<text x="54" y="479" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">주파수 다양성으로 요동을 Swerling 2 로 바꾸면 112.3 km, 호우 50 mm/h 가 20 km 구간에 걸리면 39.0 km 가 된다.</text>
<text x="54" y="501" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">PRF 1 kHz 의 비모호 거리 149.9 km 와 안테나 20 m 의 수평선(표적 3,000 m) 244 km 는 이 범위 밖이라 여기서는 걸리지 않는다.</text>
</svg>
