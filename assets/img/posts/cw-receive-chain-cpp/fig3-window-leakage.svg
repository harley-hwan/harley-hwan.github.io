<text x="430" y="32" font-size="16.5" fill="#1e293b" text-anchor="middle" font-weight="700">창을 씌우는 이유 — 잘린 끝이 스펙트럼을 더럽힌다</text>
<text x="430" y="52" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">프레임은 무한한 신호를 잘라낸 조각이다. 자른 자리가 대가를 만든다.</text>
