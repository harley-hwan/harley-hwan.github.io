<text x="660.43" y="246.21" font-size="10" fill="#1e293b" text-anchor="start" font-weight="700">약한 표적의 참값 −40 dB</text>
<text x="594.43" y="106.46" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="700">강한 표적</text>
<text x="634" y="342" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">주파수 빈 →</text>
<text x="634" y="76" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">같은 신호의 스펙트럼</text>
<line x1="472" y1="106" x2="492" y2="106" stroke="#ea580c" stroke-width="2.6"/>
<text x="498" y="110" font-size="10" fill="#1e293b" text-anchor="start" font-weight="600">직사각</text>
<line x1="472" y1="123" x2="492" y2="123" stroke="#16a34a" stroke-width="2.6"/>
<text x="498" y="127" font-size="10" fill="#1e293b" text-anchor="start" font-weight="600">Hann</text>
<text x="430" y="400" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">직사각 창에서는 −40 dB 표적 자리가 강한 표적의 사이드로브에 파묻혀 −27 dB 로 읽힌다. 표적이 아니라 누설을 재고 있는 것이다.</text>
<text x="430" y="424" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Hann 을 씌우면 같은 자리가 −41.2 dB — 참값에서 1.2 dB 안이다. 대신 메인로브가 넓어져 가까이 붙은 표적은 오히려 못 가른다.</text>
<text x="430" y="448" font-size="10.5" fill="#cbd5e1" text-anchor="middle" font-weight="400">(위 두 파형은 보기 편하게 128 샘플로 그렸고, 오른쪽 스펙트럼은 실제 설정인 512점이다.)</text>
</svg>
