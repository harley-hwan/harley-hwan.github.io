<text x="430" y="340" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">순서가 곧 정확도다 — DC 를 먼저 빼야 창이 그것을 번지게 하지 않고, 창을 걸어야 사이드로브가 약한 표적을 먹지 않는다.</text>
<text x="430" y="364" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">2.56 ms 마다 한 프레임 — 공이 빔에 머무는 60 ms 동안 추정치 20여 개가 나온다.</text>
