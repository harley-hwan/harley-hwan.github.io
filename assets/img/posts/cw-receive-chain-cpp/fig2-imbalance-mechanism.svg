<text x="390" y="70" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">불균형이 있는 경우</text>
<text x="390" y="298" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">타원 = 큰 원(정방향) + 작은 원(역방향)</text>
<rect x="536" y="78" width="232" height="200" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<line x1="550" y1="244" x2="754" y2="244" stroke="#cbd5e1" stroke-width="1.4"/>
<line x1="652" y1="244" x2="652" y2="94" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="652" y="260" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">0</text>
<text x="714" y="260" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="700">+f_d</text>
<text x="590" y="260" font-size="10.5" fill="#dc2626" text-anchor="middle" font-weight="700">−f_d</text>
<line x1="714" y1="244" x2="714" y2="108" stroke="#2563eb" stroke-width="4"/>
<line x1="590" y1="244" x2="590" y2="198" stroke="#dc2626" stroke-width="4"/>
<text x="714" y="102" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">표적</text>
<text x="590" y="190" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">유령</text>
<line x1="590" y1="198" x2="726" y2="198" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="722" y1="198" x2="722" y2="108" stroke="#64748b" stroke-width="1.4" marker-start="url(#a-m)" marker-end="url(#a-m)"/>
<text x="728" y="157" font-size="9.8" fill="#1e293b" text-anchor="start" font-weight="700">27.9 dB</text>
<text x="652" y="70" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">그 결과 스펙트럼</text>
<text x="652" y="298" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">역방향 원이 −f_d 에 선을 세운다</text>
<text x="430" y="382" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">유령이 −f_d 에 서는 이유가 이것이다 — 불균형이 만든 역방향 성분은 "같은 속도로 멀어지는 표적"과 수학적으로 구별되지 않는다.</text>
<text x="430" y="406" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">이득 0.5 dB · 위상 3° 면 작은 원의 반지름이 큰 원의 4% — 그것이 27.9 dB 차이다.</text>
