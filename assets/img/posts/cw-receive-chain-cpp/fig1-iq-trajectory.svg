<text x="675" y="304" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">원이 된다</text>
<text x="430" y="352" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">점선 원이 기준이다. 중심이 밀렸으면 DC가 남은 것이고, 찌그러졌으면 I/Q 불균형이 남은 것이다.</text>
<text x="430" y="376" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">스펙트럼보다 먼저 확인하면 두 결함을 모양으로 구분할 수 있다.</text>
