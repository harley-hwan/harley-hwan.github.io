<text x="430" y="424" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">이득 0.5 dB · 위상 3° 를 주입했을 때 이미지 억압비 실측 27.9 dB — 2편이 식으로 예측한 28.1 dB 와 일치한다.</text>
<text x="430" y="452" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">유령은 −v 자리에 선다. "같은 속도로 멀어지는 표적"이라는 물리적으로 완벽히 그럴듯한 위치라 더 위험하다.</text>
