<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<rect x="1" y="1" width="858" height="428" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="32" font-size="16.5" fill="#1e293b" text-anchor="middle" font-weight="700">빈 사이에 있는 피크를 어떻게 찾는가</text>
<text x="430" y="52" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">빈 폭은 0.61 m/s 이고 정밀도는 1 cm/s 다. 이 차이를 만드는 것이 보간이다.</text>
<rect x="52" y="86" width="372" height="250" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<line x1="66" y1="295.27" x2="410" y2="295.27" stroke="#e2e8f0" stroke-width="1"/>
