<text x="62" y="198.27" font-size="9.5" fill="#64748b" text-anchor="end" font-weight="400">-10</text>
<line x1="66" y1="160.6" x2="410" y2="160.6" stroke="#e2e8f0" stroke-width="1"/>
<text x="62" y="164.6" font-size="9.5" fill="#64748b" text-anchor="end" font-weight="400">-5</text>
<line x1="66" y1="126.93" x2="410" y2="126.93" stroke="#e2e8f0" stroke-width="1"/>
<text x="62" y="130.93" font-size="9.5" fill="#64748b" text-anchor="end" font-weight="400">0</text>
<rect x="89" y="292.44" width="18" height="9.56" rx="2" fill="#cbd5e1" opacity="0.4"/>
<text x="98" y="318" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">108</text>
<rect x="159" y="149.6" width="18" height="152.4" rx="2" fill="#2563eb" opacity="0.85"/>
<text x="168" y="318" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">109</text>
<rect x="229" y="129.11" width="18" height="172.89" rx="2" fill="#2563eb" opacity="0.85"/>
<text x="238" y="318" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">110</text>
<rect x="299" y="192.33" width="18" height="109.67" rx="2" fill="#2563eb" opacity="0.85"/>
<text x="308" y="318" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">111</text>
<rect x="369" y="344.55" width="18" height="-42.55" rx="2" fill="#cbd5e1" opacity="0.4"/>
<text x="378" y="318" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">112</text>
<path d="M126,202.06 L129.8,196.08 L133.59,190.34 L137.39,184.85 L141.19,179.61 L144.98,174.62 L148.78,169.87 L152.58,165.36 L156.37,161.1 L160.17,157.09 L163.97,153.33 L167.76,149.81 L171.56,146.53 L175.36,143.51 L179.15,140.73 L182.95,138.19 L186.75,135.9 L190.54,133.86 L194.34,132.07 L198.14,130.52 L201.93,129.21 L205.73,128.16 L209.53,127.35 L213.32,126.78 L217.12,126.46 L220.92,126.39 L224.71,126.57 L228.51,126.99 L232.31,127.65 L236.1,128.57 L239.9,129.72 L243.69,131.13 L247.49,132.78 L251.29,134.68 L255.08,136.82 L258.88,139.21 L262.68,141.85 L266.47,144.73 L270.27,147.86 L274.07,151.23 L277.86,154.86 L281.66,158.72 L285.46,162.84 L289.25,167.2 L293.05,171.8 L296.85,176.65 L300.64,181.75 L304.44,187.1 L308.24,192.69 L312.03,198.52 L315.83,204.61 L319.63,210.94 L323.42,217.51 L327.22,224.34 L331.02,231.4 L334.81,238.72 L338.61,246.28 L342.41,254.08 L346.2,262.14 L350,270.44" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linejoin="round" opacity="1.0"/>
<line x1="221.2" y1="100" x2="221.2" y2="302" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="220.13" cy="126.39" r="5" fill="#ea580c"/>
<text x="221.2" y="94" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="700">참 위치 109.76</text>
<text x="238" y="328" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">빈 번호</text>
<text x="238" y="78" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">피크 주변 세 빈에 포물선을 맞춘다</text>
<rect x="458" y="86" width="358" height="250" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="474" y="116" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="700">가운데 빈 하나만 쓰면</text>
<text x="474" y="136" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">  → 110 (오차 0.24 bin = 15 cm/s)</text>
<text x="474" y="156" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="700">세 빈으로 포물선을 맞추면</text>
<text x="474" y="176" font-size="10.5" fill="#16a34a" text-anchor="start" font-weight="700">  → 109.745 (오차 0.015 bin)</text>
<text x="474" y="196" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400"></text>
<text x="474" y="216" font-size="10.5" fill="#1e293b" text-anchor="start" font-weight="700">dB(로그) 값으로 맞춰야 한다.</text>
<text x="474" y="236" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">Hann 의 메인로브는 로그 영역에서</text>
<text x="474" y="256" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">포물선과 거의 일치한다.</text>
<text x="474" y="276" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400"></text>
<text x="474" y="296" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">선형 진폭으로 맞추거나 직사각 창을</text>
<text x="474" y="316" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">쓰면 오차가 10배로 커진다.</text>
<text x="430" y="372" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">세 점으로 빈 간격의 60분의 1까지 구한다. 실측 최대 오차 0.016 bin, 9.8 mm/s.</text>
<text x="430" y="398" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">6장의 CRLB 7.5 mm/s 와 같은 자릿수다. 정밀도의 한계는 잡음이 아니라 보간식이다.</text>
</svg>
