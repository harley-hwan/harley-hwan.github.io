<text x="62" y="265.6" font-size="9.5" fill="#64748b" text-anchor="end" font-weight="400">-20</text>
<line x1="66" y1="227.93" x2="410" y2="227.93" stroke="#e2e8f0" stroke-width="1"/>
<text x="62" y="231.93" font-size="9.5" fill="#64748b" text-anchor="end" font-weight="400">-15</text>
