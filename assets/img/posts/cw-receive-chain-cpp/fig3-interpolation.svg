<text x="430" y="408" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">Jacobsen 추정기는 직사각 창을 전제로 유도된 것이라 Hann 에 그대로 쓰면 포물선보다 16배 나쁘다.</text>
<text x="430" y="436" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">0.016 bin = 9.8 mm/s — 2편의 CRLB 7.5 mm/s 와 같은 자릿수다. 정밀도의 천장은 잡음이 아니라 보간 편향이다.</text>
