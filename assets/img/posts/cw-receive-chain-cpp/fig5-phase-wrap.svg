<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="a-r5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect x="1" y="1" width="858" height="398" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="32" font-size="16.5" fill="#1e293b" text-anchor="middle" font-weight="700">위상차는 빼지 말고 켤레곱으로 구한다</text>
<text x="430" y="52" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">두 채널의 위상이 ±180° 경계에 걸치면 뺄셈은 틀린 값을 준다.</text>
<rect x="44" y="78" width="208" height="208" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<circle cx="148" cy="182" r="78" fill="none" stroke="#e2e8f0" stroke-width="1.3"/>
<line x1="62" y1="182" x2="234" y2="182" stroke="#e2e8f0" stroke-width="1"/>
<line x1="148" y1="96" x2="148" y2="268" stroke="#e2e8f0" stroke-width="1"/>
<line x1="148" y1="182" x2="71.18" y2="168.46" stroke="#2563eb" stroke-width="2.6"/>
<circle cx="71.18" cy="168.46" r="4.5" fill="#2563eb"/>
<text x="57.4" y="160.02" font-size="10" fill="#2563eb" text-anchor="end" font-weight="700">ch0  +170°</text>
<line x1="148" y1="182" x2="71.18" y2="195.54" stroke="#ea580c" stroke-width="2.6"/>
<circle cx="71.18" cy="195.54" r="4.5" fill="#ea580c"/>
<text x="57.4" y="211.98" font-size="10" fill="#ea580c" text-anchor="end" font-weight="700">ch1  −170°</text>
<text x="148" y="70" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">두 채널의 위상</text>
<text x="148" y="306" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">실제로는 20° 차이다</text>
<text x="148" y="326" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">참 위상차 = −20°</text>
<rect x="312" y="78" width="208" height="208" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<circle cx="416" cy="182" r="78" fill="none" stroke="#e2e8f0" stroke-width="1.3"/>
<line x1="330" y1="182" x2="502" y2="182" stroke="#e2e8f0" stroke-width="1"/>
<line x1="416" y1="96" x2="416" y2="268" stroke="#e2e8f0" stroke-width="1"/>
<line x1="416" y1="182" x2="339.18" y2="168.46" stroke="#2563eb" stroke-width="2.6"/>
<circle cx="339.18" cy="168.46" r="4.5" fill="#2563eb"/>
<text x="325.4" y="160.02" font-size="10" fill="#2563eb" text-anchor="end" font-weight="700">+170°</text>
<line x1="416" y1="182" x2="339.18" y2="195.54" stroke="#ea580c" stroke-width="2.6"/>
<circle cx="339.18" cy="195.54" r="4.5" fill="#ea580c"/>
<text x="325.4" y="211.98" font-size="10" fill="#ea580c" text-anchor="end" font-weight="700">−170°</text>
<text x="416" y="70" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">arg(a) − arg(b) 로 빼면</text>
<text x="416" y="306" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">170 − (−170) = 340°</text>
<text x="416" y="326" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">→ −20° 가 아니라 +340°</text>
<path d="M376.06,189.04 A40.56,40.56 0 1 0 376.06,174.96" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#a-r5)"/>
<text x="416" y="240.56" font-size="9.8" fill="#dc2626" text-anchor="middle" font-weight="700">340° 를 도는 셈</text>
<rect x="580" y="78" width="208" height="208" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
<circle cx="684" cy="182" r="78" fill="none" stroke="#e2e8f0" stroke-width="1.3"/>
<line x1="598" y1="182" x2="770" y2="182" stroke="#e2e8f0" stroke-width="1"/>
<line x1="684" y1="96" x2="684" y2="268" stroke="#e2e8f0" stroke-width="1"/>
<line x1="684" y1="182" x2="757.3" y2="208.68" stroke="#16a34a" stroke-width="2.6"/>
<circle cx="757.3" cy="208.68" r="4.5" fill="#16a34a"/>
<text x="770.45" y="227.47" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">−20°</text>
<text x="684" y="70" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">a × conj(b) 로 구하면</text>
<text x="684" y="306" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">곱셈에서 위상이 자동으로 접힌다</text>
<text x="684" y="326" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">→ 항상 (−180°, 180°]</text>
<text x="430" y="352" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="600">각도가 가끔씩만 튄다면 이 경우일 가능성이 높다. 표적이 정면 근처에 있을 때만 경계를 넘는다.</text>
<text x="430" y="376" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">std::arg(a * std::conj(b)) 한 줄이면 된다.</text>
</svg>
