<svg width="2580" height="1320" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker></defs>
<rect x="1" y="1" width="858" height="438" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">설정 한 묶음을 넣으면 시각마다 결과 한 묶음이 나온다</text>
<text x="190" y="70" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">설정 (한 번만 읽는다)</text>
<rect x="80" y="84" width="220" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="190" y="106" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">ST_SimConfig</text>
<text x="190" y="123" font-size="11" fill="#475569" text-anchor="middle">시뮬레이션 시간 · 갱신 간격 · 표적 수</text>
<rect x="40" y="190" width="150" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="115" y="212" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">ST_PlatformInit  × 1</text>
<text x="115" y="229" font-size="11" fill="#475569" text-anchor="middle">위치 · 자세 · 속력</text>
<rect x="210" y="190" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="295" y="212" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">ST_TargetInit  × 10</text>
<text x="295" y="229" font-size="11" fill="#475569" text-anchor="middle">위치 · 자세 · 속력 · 기동 수</text>
<rect x="210" y="300" width="170" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="295" y="322" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">ST_TargetManeuver  × 30</text>
<text x="295" y="339" font-size="11" fill="#475569" text-anchor="middle">회전축 · G 값 · 시작 · 종료</text>
<line x1="150" y1="146" x2="115" y2="186" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<line x1="230" y1="146" x2="275" y2="186" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<line x1="295" y1="252" x2="295" y2="296" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<text x="312" y="278" font-size="10.5" fill="#64748b" text-anchor="start">표적마다</text>
<text x="670" y="70" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">결과 (스텝마다 새로 나온다)</text>
<rect x="560" y="84" width="220" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
<text x="670" y="106" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">ST_SimSample</text>
<text x="670" y="123" font-size="11" fill="#475569" text-anchor="middle">시각 · 스텝 번호 · 표적 수</text>
<rect x="540" y="190" width="260" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="670" y="212" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">ST_TargetState  × 11</text>
<text x="670" y="229" font-size="11" fill="#475569" text-anchor="middle">플랫폼 1 + 표적 10</text>
<text x="670" y="246" font-size="11" fill="#475569" text-anchor="middle">ECEF 위치 · ECEF 속도 · 자세 · 위경도</text>
<line x1="670" y1="146" x2="670" y2="186" stroke="#64748b" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar-mute)"/>
<line x1="300" y1="115" x2="556" y2="115" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar-ink)"/>
<text x="428" y="106" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">f_Tgt_InitSim</text>
<text x="428" y="132" font-size="10.5" fill="#475569" text-anchor="middle">0 초 상태를 만든다</text>
<path d="M 760,155 C 840,175 840,250 760,268" fill="none" stroke="#ea580c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar-orange)"/>
<text x="826" y="206" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="700" transform="rotate(90 826 206)">f_Tgt_StepSim</text>
<text x="670" y="300" font-size="11" fill="#475569" text-anchor="middle">부를 때마다 한 스텝 뒤 결과로 바뀐다</text>
<text x="670" y="318" font-size="11" fill="#475569" text-anchor="middle">위치 · 속도는 ECEF 로 갱신하고, 위경도는 출력용으로 함께 둔다</text>
<rect x="40" y="352" width="780" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="430" y="376" font-size="12" fill="#1e293b" text-anchor="middle">UI 는 두 함수와 두 구조체만 본다. 설정을 채워 넘기고, 스텝마다 결과를 받아 표와 그림에 적는다</text>
<text x="430" y="396" font-size="11" fill="#475569" text-anchor="middle">계산 로그를 켰을 때만 중간값 기록(ST_StepTrace)을 하나 더 받는다</text>
</svg>
