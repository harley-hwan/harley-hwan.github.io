<svg width="2580" height="1080" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs>
<rect x="1.0" y="1.0" width="858.0" height="358.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">넓혀 가는 순서와 넘어가는 조건</text>
<rect x="22.0" y="90.0" width="170.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="107.0" y="120.8" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">개인 시범</text>
<text x="107.0" y="138.3" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">코드 설명·스크립트</text>
<rect x="22.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="107.0" y="234.1" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">기준선보다 빠르고</text>
<text x="107.0" y="250.3" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">결함이 늘지 않음</text>
<line x1="107.0" y1="162.0" x2="107.0" y2="206.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar-green)"/>
<rect x="238.0" y="90.0" width="170.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="323.0" y="120.8" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">팀 공용 지침</text>
<text x="323.0" y="138.3" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">프롬프트·검증 규칙</text>
<rect x="238.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="323.0" y="234.1" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">같은 작업의</text>
<text x="323.0" y="250.3" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">결과 편차가 줄어듦</text>
<line x1="323.0" y1="162.0" x2="323.0" y2="206.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar-green)"/>
<rect x="454.0" y="90.0" width="170.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="539.0" y="120.8" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">팀 문서 검색</text>
<text x="539.0" y="138.3" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">RAG 와 평가 세트</text>
<rect x="454.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="539.0" y="234.1" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">평가 세트에서</text>
<text x="539.0" y="250.3" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">목표 재현율 도달</text>
<line x1="539.0" y1="162.0" x2="539.0" y2="206.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar-green)"/>
<rect x="670.0" y="90.0" width="170.0" height="70.0" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="755.0" y="120.8" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">빌드·시험 연동</text>
<text x="755.0" y="138.3" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">승인 단계가 있는 에이전트</text>
<rect x="670.0" y="210.0" width="170.0" height="56.0" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
<text x="755.0" y="234.1" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">승인 우회와</text>
<text x="755.0" y="250.3" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">권한 사고가 없음</text>
<line x1="755.0" y1="162.0" x2="755.0" y2="206.0" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar-green)"/>
<line x1="195.0" y1="125.0" x2="234.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar-mute)"/>
<line x1="411.0" y1="125.0" x2="450.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar-mute)"/>
<line x1="627.0" y1="125.0" x2="666.0" y2="125.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar-mute)"/>
<text x="430.0" y="312.0" font-size="12.5" fill="#64748b" text-anchor="middle" font-weight="400">아래 조건을 채우지 못하면 다음 단계로 가지 않고 그 단계에서 고친다</text>
<text x="430.0" y="334.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="600">승인 우회나 자료 유출이 한 번이라도 생기면 그 단계를 멈춘다</text>
</svg>
