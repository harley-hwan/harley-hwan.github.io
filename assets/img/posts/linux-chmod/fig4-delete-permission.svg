<rect x="1" y="1" width="858.0" height="358.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">파일을 지울 수 있는지는 그 파일이 아니라 담긴 디렉터리가 정한다</text>
<rect x="62.0" y="62.0" width="350.0" height="224.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="88.0" y="92.0" width="298.0" height="158.0" rx="10" fill="#16a34a" fill-opacity="0.07" stroke="#16a34a" stroke-width="1.6"/>
<text x="108.0" y="116.0" font-size="11.5" fill="#16a34a" text-anchor="start" font-weight="700">디렉터리</text>
<text x="366.0" y="116.0" font-size="12.5" fill="#16a34a" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">drwxrwxrwx</text>
<text x="237.0" y="133.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="400">누구나 쓸 수 있다</text>
<rect x="124.0" y="144.0" width="226.0" height="58.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="146.0" y="168.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="700">파일</text>
<text x="328.0" y="168.0" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">----------</text>
<text x="237.0" y="189.0" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">아무도 못 읽고 못 쓰는 파일인데도</text>
<rect x="124.0" y="212.0" width="226.0" height="28.0" rx="6" fill="#16a34a" fill-opacity="0.14" stroke="#16a34a" stroke-width="1.3"/>
<text x="237.0" y="231.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="700">rm 이 성공한다</text>
<rect x="448.0" y="62.0" width="350.0" height="224.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="474.0" y="92.0" width="298.0" height="158.0" rx="10" fill="#dc2626" fill-opacity="0.07" stroke="#dc2626" stroke-width="1.6"/>
<text x="494.0" y="116.0" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">디렉터리</text>
<text x="752.0" y="116.0" font-size="12.5" fill="#dc2626" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">drwxr-xr-x</text>
<text x="623.0" y="133.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="400">나는 쓸 수 없다</text>
<rect x="510.0" y="144.0" width="226.0" height="58.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="532.0" y="168.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="700">파일</text>
<text x="714.0" y="168.0" font-size="12.5" fill="#64748b" text-anchor="end" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-rwxrwxrwx</text>
<text x="623.0" y="189.0" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400">누구나 고칠 수 있는 파일인데도</text>
<rect x="510.0" y="212.0" width="226.0" height="28.0" rx="6" fill="#dc2626" fill-opacity="0.14" stroke="#dc2626" stroke-width="1.3"/>
<text x="623.0" y="231.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">rm 이 거부된다</text>
<line x1="40.0" y1="302.0" x2="820.0" y2="302.0" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/>
<text x="430.0" y="326.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">지운다는 것은 파일을 건드리는 일이 아니라 디렉터리에서 이름 하나를 빼는 일이기 때문이다.</text>
<text x="430.0" y="346.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">그래서 필요한 것은 파일의 w 가 아니라 디렉터리의 w 다.</text>
