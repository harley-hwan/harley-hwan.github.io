<text x="134.0" y="161.0" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="400">내용을 읽는다</text>
<rect x="464.0" y="128.0" width="318.0" height="56.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
