<text x="72" y="96" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="700">참값</text>
<text x="72" y="114" font-size="11.5" fill="#dc2626" text-anchor="start" font-weight="700">단일 CV 모델 — 선회에서 밖으로 밀린다</text>
<text x="72" y="132" font-size="11.5" fill="#16a34a" text-anchor="start" font-weight="700">IMM</text>
