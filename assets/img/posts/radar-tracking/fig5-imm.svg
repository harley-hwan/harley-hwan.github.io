<text x="790" y="126" font-size="11.5" fill="#ea580c" text-anchor="end" font-weight="700">기동</text>
<rect x="34" y="320" width="792" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="344" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">프로세스 잡음 Q 를 작게 잡으면 직진은 매끄럽지만 선회에서 트랙이 밖으로 밀린다.</text>
<text x="54" y="363" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">크게 잡으면 선회는 따라가는데 직진 구간에서 측정 잡음을 그대로 물고 흔들린다.</text>
<text x="54" y="382" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">IMM 은 모델 여러 개를 동시에 돌리고, 이노베이션의 우도로 각 모델의 확률을 매 스텝 갱신한다.</text>
<text x="54" y="401" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">오른쪽 그래프가 그 확률이다. 20 s 에 기동 모델로 넘어가고 40 s 에 등속으로 되돌아온다.</text>
<text x="54" y="420" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">비용은 모델 수만큼의 필터와 섞기 단계뿐이다 — 대개 2~3 개면 충분하다.</text>
</svg>
