<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="422" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">게이팅과 연관 — 후보를 줄이고, 남은 것을 어떻게 쓸까</text>
<rect x="48" y="74" width="764" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<ellipse cx="300.00" cy="176.00" rx="150.00" ry="72.00" fill="#ea580c" fill-opacity="0.08" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="7 5" transform="rotate(-14.00 300.00 176.00)"/>
<circle cx="300" cy="176" r="6" fill="#ea580c" stroke="#ffffff" stroke-width="1.6"/>
<text x="300" y="84" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="700">예측 위치 x̂(k|k−1)</text>
<text x="458" y="234" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">게이트  νᵀS⁻¹ν ≤ γ</text>
<circle cx="238" cy="152" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6"/>
<text x="238" y="138" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">z₁</text>
<text x="238" y="174" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="400">β=0.55</text>
<circle cx="352" cy="196" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6"/>
<text x="352" y="182" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">z₂</text>
<text x="352" y="218" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="400">β=0.31</text>
<circle cx="392" cy="128" r="5.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.6"/>
<text x="392" y="114" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">z₃</text>
<text x="392" y="150" font-size="10.5" fill="#7c3aed" text-anchor="middle" font-weight="400">β=0.14</text>
<circle cx="520" cy="232" r="5.5" fill="#64748b" stroke="#ffffff" stroke-width="1.6"/>
<text x="520" y="218" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">z₄</text>
<text x="520" y="254" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">게이트 밖 → 신규 트랙 후보</text>
<line x1="308" y1="170" x2="236" y2="154" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<text x="196" y="122" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="700">NN — 가장 가까운 하나만</text>
<text x="600" y="118" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">PDA — 전부 확률로 섞는다</text>
<text x="600" y="140" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">ν̄ = Σ βᵢ νᵢ</text>
<text x="600" y="162" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">β₀ 는 '전부 오경보' 확률</text>
<text x="600" y="190" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">JPDA — 트랙끼리 경합까지 함께</text>
<text x="600" y="212" font-size="11.5" fill="#7c3aed" text-anchor="start" font-weight="700">MHT — 가설을 미뤄 두고 나중에 정리</text>
<rect x="34" y="292" width="792" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="316" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">게이트는 마할라노비스 거리 문턱이다. γ 는 카이제곱 분위수 — M=3, P_G=0.99 면 11.345.</text>
<text x="54" y="335" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">게이트를 키우면 표적을 놓칠 확률은 줄지만 게이트 안에 들어오는 오경보가 늘어난다.</text>
<text x="54" y="354" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">NN 은 싸고 대부분 잘 듣는다. 클러터가 짙거나 트랙이 붙어 있으면 한 번의 오연관이 트랙을 앗아간다.</text>
<text x="54" y="373" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">PDA 는 하나를 고르지 않는다. 확률로 가중한 이노베이션을 쓰고, 그만큼 공분산을 늘려 준다.</text>
<text x="54" y="392" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">고르는 순간이 가장 위험하다 — 필터를 아무리 잘 짜도 연관이 틀리면 되돌릴 수 없다.</text>
</svg>
