<rect x="1" y="1" width="858" height="450" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">필터가 제대로 튜닝됐는지 보는 법 — NIS 일관성 검정</text>
<rect x="66" y="78" width="746" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<rect x="106" y="212.583" width="676" height="16.0576" rx="0" fill="#16a34a" stroke="none" stroke-width="1.6" fill-opacity="0.13"/>
<line x1="106" y1="212.583" x2="782" y2="212.583" stroke="#16a34a" stroke-width="1.6" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="106" y1="228.641" x2="782" y2="228.641" stroke="#16a34a" stroke-width="1.6" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="106" y1="221" x2="782" y2="221" stroke="#64748b" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4"/>
<text x="100" y="225" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400">1.0</text>
<text x="776" y="202.583" font-size="11" fill="#16a34a" text-anchor="end" font-weight="700">95 % 구간  [0.81, 1.21]</text>
<line x1="106" y1="262" x2="782" y2="262" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<line x1="106" y1="262" x2="106" y2="94" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<text x="788" y="266" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="700">k</text>
<text x="110" y="104" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">평균 NIS</text>
<path d="M140.5,221.8 L157.7,225.3 L174.9,232.9 L192.2,225.1 L209.4,227.8 L226.6,220.4 L243.8,223.7 L261.1,222.8 L278.3,222.3 L295.5,223.2 L312.8,225.1 L330.0,222.5 L347.2,216.9 L364.5,220.3 L381.7,218.3 L398.9,216.4 L416.2,224.0 L433.4,226.8 L450.6,222.5 L467.8,220.2 L485.1,214.8 L502.3,221.4 L519.5,217.9 L536.8,226.2 L554.0,221.8 L571.2,222.0 L588.5,219.0 L605.7,222.0 L622.9,224.9 L640.2,221.8 L657.4,228.0 L674.6,225.3 L691.8,225.3 L709.1,223.5 L726.3,221.8 L743.5,219.2 L760.8,217.5 L778.0,219.2" fill="none" stroke="#16a34a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="776" y="108" font-size="11.5" fill="#16a34a" text-anchor="end" font-weight="700">맞게 튜닝 (Q 적정)</text>
<path d="M140.5,222.9 L157.7,225.9 L174.9,222.1 L192.2,225.6 L209.4,226.6 L226.6,223.5 L243.8,224.9 L261.1,227.4 L278.3,219.2 L295.5,222.9 L312.8,227.2 L330.0,220.8 L347.2,211.5 L364.5,223.2 L381.7,217.5 L398.9,217.2 L416.2,215.6 L433.4,219.4 L450.6,212.6 L467.8,220.2 L485.1,207.4 L502.3,217.4 L519.5,216.8 L536.8,209.7 L554.0,212.9 L571.2,210.5 L588.5,214.5 L605.7,217.3 L622.9,215.9 L640.2,204.3 L657.4,202.5 L674.6,197.9 L691.8,199.2 L709.1,201.9 L726.3,202.7 L743.5,196.2 L760.8,202.1 L778.0,188.8" fill="none" stroke="#dc2626" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="776" y="126" font-size="11.5" fill="#dc2626" text-anchor="end" font-weight="700">Q 가 너무 작다 (과신)</text>
<path d="M140.5,230.5 L157.7,227.9 L174.9,229.9 L192.2,232.3 L209.4,222.5 L226.6,222.0 L243.8,230.1 L261.1,224.5 L278.3,226.3 L295.5,227.1 L312.8,227.7 L330.0,225.3 L347.2,227.8 L364.5,224.4 L381.7,228.6 L398.9,227.2 L416.2,224.1 L433.4,232.5 L450.6,226.2 L467.8,226.7 L485.1,225.5 L502.3,229.4 L519.5,229.8 L536.8,230.5 L554.0,235.5 L571.2,229.1 L588.5,225.0 L605.7,228.1 L622.9,223.4 L640.2,226.4 L657.4,222.3 L674.6,230.0 L691.8,223.5 L709.1,225.7 L726.3,226.2 L743.5,225.6 L760.8,227.3 L778.0,233.5" fill="none" stroke="#2563eb" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="776" y="144" font-size="11.5" fill="#2563eb" text-anchor="end" font-weight="700">Q 가 너무 크다 (과보수)</text>
<rect x="34" y="310" width="792" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="334" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">NIS = νᵀ S⁻¹ ν 는 이노베이션을 그 자신의 공분산으로 정규화한 값이다. 기대값이 측정 차원 M 과 같다.</text>
<text x="54" y="353" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">여기서는 M=1, 200 회 평균이라 95 % 구간이 [0.81, 1.21] 다. 이 띠를 벗어나면 필터가 틀린 것이다.</text>
<text x="54" y="372" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">위로 뚫으면 과신 — 공분산이 실제보다 작다. Q 를 키우거나 R 을 다시 재야 한다.</text>
<text x="54" y="391" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">아래로 처지면 과보수 — 공분산이 너무 커서 게이트가 헐거워지고 오연관이 늘어난다.</text>
<text x="54" y="410" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">참값을 모르는 실장비에서도 NIS 는 잴 수 있다. 튜닝을 감이 아니라 숫자로 하는 유일한 방법이다.</text>
</svg>
