<text x="430.0" y="346.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">덮는 넓이가 같으니 송신을 넓히면 그만큼 이득이 내려가고, 나눠 쏘면 그만큼 시간이 든다.</text>
<text x="430.0" y="368.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">넓힌 쪽은 한 발에 11.8 dB 를 잃고, 나눈 쪽은 한 바퀴에 14 배의 시간을 쓴다. 두 값이 거의 같다.</text>
<text x="430.0" y="390.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">그래서 고를 것은 성능이 아니라 무엇을 먼저 볼 것이냐다. 거리인가, 갱신 주기인가.</text>
