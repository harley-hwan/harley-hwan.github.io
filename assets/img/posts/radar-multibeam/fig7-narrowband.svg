<text x="720.0" y="192.0" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">빔 출력</text>
<text x="636.0" y="292.0" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">같은 x 에 가중을 M 벌 곱하면 빔이 M 개 나온다</text>
<text x="636.0" y="312.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">소자가 받은 숫자는 몇 번을 다시 합치든 그대로 남아 있다</text>
<rect x="40.0" y="340.0" width="780.0" height="78.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="266.0" y="370.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">w = a · exp( −j2π ( u₀·x + v₀·y ) )</text>
<line x1="534.0" y1="352.0" x2="534.0" y2="396.0" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="butt"/>
<text x="676.0" y="370.0" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="700">y = Σ w · x</text>
<text x="430.0" y="400.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">a 는 부엽을 낮추는 가중, 지수부가 방향을 정한다. 소자 위치 x, y 는 파장 단위다.</text>
<rect x="40.0" y="434.0" width="780.0" height="136.0" rx="8" fill="#ea580c" fill-opacity="0.06"/>
<rect x="40.0" y="434.0" width="780.0" height="136.0" rx="8" fill="none" stroke="#ea580c" stroke-width="1.3"/>
<text x="430.0" y="456.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="700">지연을 위상으로 바꿔도 되는 조건 — 밴드 가장자리에서 빔이 밀리는 양</text>
<text x="190.0" y="480.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">대역폭</text>
<text x="430.0" y="480.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">30° 조향에서 밀리는 양</text>
<text x="670.0" y="480.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">빔폭 대비</text>
