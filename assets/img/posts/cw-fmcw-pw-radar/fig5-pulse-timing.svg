<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="458" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">펄스 열의 시간 예산 — τ 와 PRI 가 정하는 두 한계</text>
<line x1="60" y1="176" x2="800" y2="176" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<text x="806" y="180" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">t</text>
<rect x="86" y="114" width="26" height="62" rx="0" fill="#ea580c" stroke="none" stroke-width="1.6" fill-opacity="0.22"/>
<path d="M86.0,176 L86.0,114 L112.0,114 L112.0,176" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="112" y="114" width="210" height="62" rx="0" fill="#0284c7" stroke="none" stroke-width="1.6" fill-opacity="0.07"/>
<text x="217" y="146" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">수신 창</text>
<rect x="322" y="114" width="26" height="62" rx="0" fill="#ea580c" stroke="none" stroke-width="1.6" fill-opacity="0.22"/>
<path d="M322.0,176 L322.0,114 L348.0,114 L348.0,176" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="348" y="114" width="210" height="62" rx="0" fill="#0284c7" stroke="none" stroke-width="1.6" fill-opacity="0.07"/>
<text x="453" y="146" font-size="12" fill="#0284c7" text-anchor="middle" font-weight="700">수신 창</text>
<rect x="558" y="114" width="26" height="62" rx="0" fill="#ea580c" stroke="none" stroke-width="1.6" fill-opacity="0.22"/>
<path d="M558.0,176 L558.0,114 L584.0,114 L584.0,176" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="584" y="114" width="210" height="62" rx="0" fill="#0284c7" stroke="none" stroke-width="1.6" fill-opacity="0.07"/>
<line x1="86" y1="98" x2="112" y2="98" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-red)"/>
<line x1="112" y1="98" x2="86" y2="98" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-red)"/>
<text x="99" y="91" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">τ = 10 µs</text>
<line x1="86" y1="70" x2="322" y2="70" stroke="#2563eb" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="322" y1="70" x2="86" y2="70" stroke="#2563eb" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<text x="204" y="63" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">PRI = 1 / PRF = 1 ms</text>
<line x1="86" y1="76" x2="86" y2="114" stroke="#64748b" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="322" y1="76" x2="322" y2="114" stroke="#64748b" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
<path d="M208.0,176 L208.0,210 L224.0,210 L224.0,176" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="208" y="176" width="16" height="34" rx="0" fill="#16a34a" stroke="none" stroke-width="1.6" fill-opacity="0.22"/>
<text x="216" y="228" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="700">에코</text>
<line x1="112" y1="238" x2="208" y2="238" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#ar-violet)"/>
<text x="160" y="254" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">왕복 시간 2R/c 를 그대로 잰다</text>
<rect x="86" y="282" width="26" height="20" rx="0" fill="#dc2626" stroke="none" stroke-width="1.6" fill-opacity="0.3"/>
<rect x="322" y="282" width="26" height="20" rx="0" fill="#dc2626" stroke="none" stroke-width="1.6" fill-opacity="0.3"/>
<text x="362" y="297" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">송신 중이라 못 듣는 구간 (이클립싱) —  R_min = cτ/2 = 1.5 km</text>
<text x="86" y="330" font-size="12" fill="#2563eb" text-anchor="start" font-weight="700">다음 펄스가 나가기 전에 돌아와야 한다 —  R_max = c/2·PRF = 149.9 km</text>
<rect x="34" y="348" width="792" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="372" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">듀티 d = τ·PRF = 1 % — 평균 전력은 첨두의 1/100 이다. 방열은 평균으로, 내압은 첨두로 설계한다.</text>
<text x="54" y="391" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">τ 를 늘리면 에너지가 늘어 멀리 보지만 최소 거리와 거리 분해능이 함께 나빠진다.</text>
<text x="54" y="410" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">PRF 를 올리면 도플러 창이 넓어지지만 최대 비모호 거리가 줄어든다. 이 상충이 4절의 주제다.</text>
<text x="54" y="429" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">τ 와 분해능의 매듭만은 풀 수 있다 — 그것이 3절의 펄스 압축이다.</text>
</svg>
