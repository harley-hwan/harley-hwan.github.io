<text x="232.0" y="294.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">경로차가 없다</text>
<text x="232.0" y="316.0" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">다섯 소자에 한꺼번에 닿는다</text>
<text x="232.0" y="350.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">파의 마루가 다섯 소자에 같은 시각에 도착한다</text>
