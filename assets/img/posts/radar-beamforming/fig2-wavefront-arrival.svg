<text x="749.0" y="202.0" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="700">θ</text>
<text x="628.0" y="350.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">오른쪽 소자부터 차례로 도착한다 (숫자가 닿는 순서)</text>
<rect x="44.0" y="372.0" width="772.0" height="94.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="430.0" y="396.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">정면에서 오면 파면이 소자들에 동시에 닿으므로 마루와 골이 나란히 맞는다. 그대로 더하면 소자 수만큼 커진다.</text>
<text x="430.0" y="418.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">비스듬히 오면 왼쪽 소자일수록 그만큼 더 가야 해서 늦게 닿는다. 이웃 소자 사이의 차이가 d·sinθ 다.</text>
<text x="430.0" y="440.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">그래서 소자마다 파의 위치가 어긋난 채로 도착한다. 그대로 더하면 어떻게 되는지는 다음 그림에 있다.</text>
<text x="430.0" y="459.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">주황색 선이 파면이다. 마루가 같은 시각에 놓이는 면이고 파가 나아가는 방향과 직각이다.</text>
