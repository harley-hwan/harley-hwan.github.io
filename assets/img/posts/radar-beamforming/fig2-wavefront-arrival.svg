<text x="628.0" y="316.0" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">빨간 선이 이웃 소자 사이의 경로차 d·sinθ 다</text>
<line x1="740.0" y1="250.0" x2="740.0" y2="176.0" stroke="#64748b" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="3 3"/>
