<rect x="68" y="224" width="22" height="14" rx="0" fill="#16a34a" stroke="none" stroke-width="1.6" fill-opacity="0.35"/>
<text x="431" y="306" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">빗살의 골마다 표적이 사라진다 — 이것이 blind speed 다</text>
<rect x="34" y="326" width="792" height="116" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="350" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">정지 클러터는 0 Hz 에 모이므로 이웃 펄스끼리 빼기만 해도 지워진다. 그것이 지연선 상쇄기다.</text>
<text x="54" y="369" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">그런데 응답이 PRF 주기로 반복되어, 도플러가 PRF 의 정수배인 표적도 함께 지워진다.</text>
<text x="54" y="388" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">첫 blind speed 는 λ·PRF/2 = 15.8 m/s. 9.5 GHz · 1 kHz 에서는 시속 57 km 가 안 보인다.</text>
<text x="54" y="407" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">PRF 를 펄스마다 흔들면(staggered PRF) 골이 서로 어긋나 첫 blind speed 를 훨씬 뒤로 민다.</text>
<text x="54" y="426" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">가우시안 클러터 σ_f = 10 Hz 기준 개선 계수는 2펄스 27.1 dB, 3펄스 51.1 dB 다.</text>
