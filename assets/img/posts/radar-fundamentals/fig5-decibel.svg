<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="398" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">데시벨 — 곱셈을 덧셈으로 바꾸는 자</text>
<line x1="80" y1="134" x2="790" y2="134" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<line x1="96" y1="126" x2="96" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="96" y="116" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">0 dB</text>
<text x="96" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">1×</text>
<line x1="129.4" y1="126" x2="129.4" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="129.4" y="100" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">3 dB</text>
<line x1="129.4" y1="104" x2="129.4" y2="124" stroke="#94a3b8" stroke-width="1" stroke-linecap="butt"/>
<text x="129.4" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">2×</text>
<line x1="162.8" y1="126" x2="162.8" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="162.8" y="116" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">6 dB</text>
<text x="162.8" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">4×</text>
<line x1="207.333" y1="126" x2="207.333" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="207.333" y="100" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">10 dB</text>
<line x1="207.333" y1="104" x2="207.333" y2="124" stroke="#94a3b8" stroke-width="1" stroke-linecap="butt"/>
<text x="207.333" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">10×</text>
<line x1="318.667" y1="126" x2="318.667" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="318.667" y="116" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">20 dB</text>
<text x="318.667" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">100×</text>
<line x1="430" y1="126" x2="430" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="430" y="116" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">30 dB</text>
<text x="430" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">1,000×</text>
<line x1="541.333" y1="126" x2="541.333" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="541.333" y="116" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">40 dB</text>
<text x="541.333" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">10⁴×</text>
<line x1="764" y1="126" x2="764" y2="142" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt"/>
<text x="764" y="116" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">60 dB</text>
<text x="764" y="162" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="600">10⁶×</text>
<text x="796" y="138" font-size="11" fill="#64748b" text-anchor="start" font-weight="600">전력비</text>
<rect x="72" y="178" width="356" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="90" y="200" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">전력비 vs 진폭비</text>
<text x="90" y="221" font-size="12" fill="#16a34a" text-anchor="start" font-weight="600">전력  P₂/P₁  →  10 log₁₀</text>
<text x="90" y="240" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600">진폭  A₂/A₁  →  20 log₁₀</text>
<text x="90" y="261" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">FFT 크기는 진폭이다 — 20 log₁₀ 를 쓴다.</text>
<rect x="444" y="178" width="344" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="462" y="200" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">절대 기준이 붙으면 단위가 된다</text>
<text x="462" y="221" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">dBm   1 mW 기준 — 1 W = 30 dBm</text>
<text x="462" y="240" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">dBi    등방성 안테나 기준</text>
<text x="462" y="261" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="600">dBc   반송파 기준 (위상잡음)</text>
<rect x="56" y="292" width="748" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="314" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">암산 조합: 3 dB=2배, 10 dB=10배 를 더하고 빼면 된다. 13 dB = 10+3 = 20배,  27 dB = 30−3 = 500배.</text>
<text x="74" y="333" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">레이더 방정식은 수신 전력이 R⁻⁴ 다 — 탐지 거리를 2배로 늘리려면 12 dB(16배), 10배로는 40 dB(1만 배).</text>
<text x="74" y="352" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">dBm 끼리 더하는 것은 의미가 없다. dBm + dB(이득) = dBm 이 성립하는 조합이다.</text>
</svg>
