<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="428" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">듀티 사이클 — 펄스 폭과 반복 주기가 정하는 것</text>
<line x1="108" y1="196" x2="764" y2="196" stroke="#94a3b8" stroke-width="1.7" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<rect x="130" y="128" width="30" height="68" rx="2" fill="#ea580c" stroke="none" stroke-width="0" fill-opacity="0.22"/>
<path d="M130,196 L130,128 L160,128 L160,196" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="280" y="128" width="30" height="68" rx="2" fill="#ea580c" stroke="none" stroke-width="0" fill-opacity="0.22"/>
<path d="M280,196 L280,128 L310,128 L310,196" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="128" width="30" height="68" rx="2" fill="#ea580c" stroke="none" stroke-width="0" fill-opacity="0.22"/>
<path d="M430,196 L430,128 L460,128 L460,196" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="580" y="128" width="30" height="68" rx="2" fill="#ea580c" stroke="none" stroke-width="0" fill-opacity="0.22"/>
<path d="M580,196 L580,128 L610,128 L610,196" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="770" y="200" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">t</text>
<line x1="130" y1="84" x2="130" y2="196" stroke="#64748b" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="280" y1="84" x2="280" y2="196" stroke="#64748b" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="160" y1="108" x2="160" y2="128" stroke="#64748b" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 3"/>
<line x1="130" y1="108" x2="160" y2="108" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-red)"/>
<line x1="160" y1="108" x2="130" y2="108" stroke="#dc2626" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-red)"/>
<text x="145" y="100" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">τ</text>
<line x1="130" y1="84" x2="280" y2="84" stroke="#2563eb" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="280" y1="84" x2="130" y2="84" stroke="#2563eb" stroke-width="2" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<text x="205" y="76" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">T = 1 / PRF</text>
<text x="100" y="200" font-size="12" fill="#ea580c" text-anchor="end" font-weight="700">펄스</text>
<text x="130" y="234" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">d = τ / T = τ · PRF</text>
<text x="320" y="234" font-size="13.5" fill="#1e293b" text-anchor="start" font-weight="700">평균 전력 = 첨두 전력 × d</text>
<rect x="130" y="255" width="600" height="19" rx="2" fill="#16a34a" stroke="none" stroke-width="0" fill-opacity="0.18"/>
<line x1="130" y1="274" x2="730" y2="274" stroke="#16a34a" stroke-width="3.2" stroke-linecap="butt"/>
<line x1="130" y1="255" x2="730" y2="255" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt"/>
<text x="100" y="278" font-size="12" fill="#16a34a" text-anchor="end" font-weight="700">CW</text>
<text x="742" y="278" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">듀티 100 %</text>
<rect x="56" y="300" width="748" height="112" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="322" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">첨두 10 kW, 듀티 0.1 % 면 평균은 10 W 다. 방열은 평균으로, 내압은 첨두로 설계한다.</text>
<text x="74" y="341" font-size="12.5" fill="#dc2626" text-anchor="start" font-weight="700">최소 거리  R_min = cτ/2 — 송신 중에는 못 받는다. τ = 1 µs 면 150 m 안쪽이 통째로 안 보인다.</text>
<text x="74" y="360" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">최대 비모호 거리  R_max = c/(2·PRF) — PRF = 1 kHz 면 150 km. 이 둘이 서로 반대로 당긴다.</text>
<text x="74" y="379" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">CW 는 듀티가 100 % 라 최소 거리가 없는 대신 거리를 아예 못 잰다. 그리고 송수신이 동시라 TX 누설이 남는다.</text>
</svg>
