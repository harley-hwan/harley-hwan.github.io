<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 550" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="tw-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="tw-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="548" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">왕복이 계수 2 를 만든다 — 반사파의 마루 간격은 2vt 만큼 좁다</text>

<text x="635" y="66" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">λ</text>
<line x1="560" y1="76" x2="710" y2="76" stroke="#64748b" stroke-width="1.3"/>
<line x1="560" y1="71" x2="560" y2="81" stroke="#64748b" stroke-width="1.3"/>
<line x1="710" y1="71" x2="710" y2="81" stroke="#64748b" stroke-width="1.3"/>

<text x="110" y="98" font-size="12" fill="#0284c7" text-anchor="start" font-weight="700">송신파</text>
<line x1="110" y1="118" x2="800" y2="118" stroke="#e2e8f0" stroke-width="1.6"/>
<line x1="230" y1="118" x2="300" y2="118" stroke="#0284c7" stroke-width="2" marker-end="url(#tw-sky)"/>
<circle cx="110" cy="118" r="8" fill="#16a34a"/>
<text x="110" y="140" font-size="10.5" fill="#16a34a" text-anchor="middle" font-weight="700">레이다</text>
<line x1="560" y1="96" x2="560" y2="140" stroke="#2563eb" stroke-width="2.8"/>
<line x1="710" y1="96" x2="710" y2="140" stroke="#dc2626" stroke-width="2.8"/>
<circle cx="710" cy="118" r="8.5" fill="#1e293b"/>
<text x="728" y="122" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="700">표적</text>
<line x1="704" y1="160" x2="659" y2="160" stroke="#dc2626" stroke-width="2.4" marker-end="url(#tw-red)"/>
<text x="681" y="177" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">v</text>
<text x="110" y="200" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">ⓐ 첫 마루가 표적에 닿는 순간 — 마루 간격은 아직 λ 다</text>

<text x="635" y="238" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">λ′ = λ − 2vt</text>
<line x1="605" y1="248" x2="665" y2="248" stroke="#dc2626" stroke-width="1.5"/>
<line x1="605" y1="243" x2="605" y2="253" stroke="#dc2626" stroke-width="1.5"/>
<line x1="665" y1="243" x2="665" y2="253" stroke="#dc2626" stroke-width="1.5"/>

<text x="170" y="270" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">반사파</text>
<line x1="110" y1="290" x2="800" y2="290" stroke="#e2e8f0" stroke-width="1.6"/>
<line x1="300" y1="290" x2="230" y2="290" stroke="#dc2626" stroke-width="2" marker-end="url(#tw-red)"/>
<circle cx="110" cy="290" r="8" fill="#16a34a"/>
<circle cx="710" cy="290" r="8.5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="722" y="278" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400">직전 위치</text>
<circle cx="665" cy="290" r="8.5" fill="#1e293b"/>
<line x1="605" y1="268" x2="605" y2="312" stroke="#dc2626" stroke-width="2.8"/>
<line x1="665" y1="268" x2="665" y2="312" stroke="#2563eb" stroke-width="2.8"/>

<line x1="665" y1="330" x2="710" y2="330" stroke="#64748b" stroke-width="1.3"/>
<line x1="665" y1="325" x2="665" y2="335" stroke="#64748b" stroke-width="1.3"/>
<line x1="710" y1="325" x2="710" y2="335" stroke="#64748b" stroke-width="1.3"/>
<text x="687" y="347" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">vt</text>

<line x1="605" y1="364" x2="710" y2="364" stroke="#64748b" stroke-width="1.3"/>
<line x1="605" y1="359" x2="605" y2="369" stroke="#64748b" stroke-width="1.3"/>
<line x1="710" y1="359" x2="710" y2="369" stroke="#64748b" stroke-width="1.3"/>
<text x="657" y="381" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="700">λ − vt</text>

<text x="110" y="404" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">ⓑ 표적은 vt 다가왔고  ⓒ 첫 반사 마루는 λ − vt 만 진행했다  →  ⓓ 반사파 간격은 λ − 2vt</text>

<text x="430" y="440" font-size="15.5" fill="#1e293b" text-anchor="middle" font-weight="700">λ′ = λ − 2vt   ⟹   Δf / f = 2v / c   ⟹   f_d = 2v / λ</text>

<rect x="56" y="462" width="748" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="486" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">압축이 두 번 일어난다 — 가는 길에 한 번, 오는 길에 한 번. 계수 2 는 여기서 나온다.</text>
<text x="74" y="505" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">편도로 한 번만 받는 ES/ESM 은 압축이 한 번이라 절반이다 — f_d = v / λ.</text>
<text x="74" y="524" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">t 는 두 마루 사이의 시간, λ′ 는 반사파의 파장이다. v ≪ c 를 가정한 근사이고, 멀어지는 표적이면 부호가 뒤집혀 늘어난다.</text>
</svg>
