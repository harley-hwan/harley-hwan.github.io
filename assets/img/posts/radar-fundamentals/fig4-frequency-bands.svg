<rect x="56" y="418" width="748" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="440" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">보라 점선은 대기 흡수선 — 22.2 GHz 는 수증기, 60 GHz 는 산소. 장거리 레이다는 이 위를 피한다.</text>
<text x="74" y="459" font-size="12" fill="#1e293b" text-anchor="start" font-weight="600">K 밴드가 Ku(under)와 Ka(above)로 갈라진 이유가 22.2 GHz 흡수선이다. 24 GHz ISM 은 그 바로 위에 있다.</text>
<text x="74" y="477.5" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">NATO/EU 의 A–M 밴드 지정은 완전히 다른 체계다. IEEE 의 X 밴드와 NATO 의 X 밴드는 같은 대역이 아니다.</text>
