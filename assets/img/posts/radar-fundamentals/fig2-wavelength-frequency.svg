<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 416" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="414" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">주파수가 올라가면 파장이 줄고, 안테나가 같이 줄어든다</text>
<text x="134" y="68" font-size="13.5" fill="#1e293b" text-anchor="end" font-weight="700">λ = c / f</text>
<text x="148" y="68" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">막대 길이는 실제 파장 비율 그대로 (진공·공기 기준)</text>
<text x="132" y="111" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">1 GHz</text>
<rect x="148" y="95" width="548" height="22" rx="4" fill="#2563eb" stroke="none" stroke-width="0" fill-opacity="0.18"/>
<line x1="148" y1="106" x2="696" y2="106" stroke="#2563eb" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="148" y1="93" x2="148" y2="119" stroke="#2563eb" stroke-width="2" stroke-linecap="butt"/>
<line x1="696" y1="93" x2="696" y2="119" stroke="#2563eb" stroke-width="2" stroke-linecap="butt"/>
<line x1="148" y1="125" x2="422" y2="125" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/>
<circle cx="422" cy="125" r="3.4" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="710" y="105" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">λ = 299.79 mm</text>
<text x="710" y="121" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">λ/2 = 149.90 mm</text>
<text x="132" y="173" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">10 GHz</text>
<rect x="148" y="157" width="54.8018" height="22" rx="4" fill="#0284c7" stroke="none" stroke-width="0" fill-opacity="0.18"/>
<line x1="148" y1="168" x2="202.802" y2="168" stroke="#0284c7" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="148" y1="155" x2="148" y2="181" stroke="#0284c7" stroke-width="2" stroke-linecap="butt"/>
<line x1="202.802" y1="155" x2="202.802" y2="181" stroke="#0284c7" stroke-width="2" stroke-linecap="butt"/>
<line x1="148" y1="187" x2="175.401" y2="187" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/>
<circle cx="175.401" cy="187" r="3.4" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="216.802" y="167" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">λ = 29.98 mm</text>
<text x="216.802" y="183" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">λ/2 = 14.99 mm</text>
<text x="132" y="235" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">24 GHz</text>
<rect x="148" y="219" width="22.831" height="22" rx="4" fill="#16a34a" stroke="none" stroke-width="0" fill-opacity="0.18"/>
<line x1="148" y1="230" x2="170.831" y2="230" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="148" y1="217" x2="148" y2="243" stroke="#16a34a" stroke-width="2" stroke-linecap="butt"/>
<line x1="170.831" y1="217" x2="170.831" y2="243" stroke="#16a34a" stroke-width="2" stroke-linecap="butt"/>
<line x1="148" y1="249" x2="159.416" y2="249" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/>
<circle cx="159.416" cy="249" r="3.4" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="184.831" y="229" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">λ = 12.49 mm</text>
<text x="184.831" y="245" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">λ/2 = 6.25 mm</text>
<text x="132" y="297" font-size="13" fill="#1e293b" text-anchor="end" font-weight="700">77 GHz</text>
<rect x="148" y="281" width="7.11071" height="22" rx="4" fill="#ea580c" stroke="none" stroke-width="0" fill-opacity="0.18"/>
<line x1="148" y1="292" x2="155.111" y2="292" stroke="#ea580c" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="148" y1="279" x2="148" y2="305" stroke="#ea580c" stroke-width="2" stroke-linecap="butt"/>
<line x1="155.111" y1="279" x2="155.111" y2="305" stroke="#ea580c" stroke-width="2" stroke-linecap="butt"/>
<line x1="148" y1="311" x2="151.555" y2="311" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/>
<circle cx="151.555" cy="311" r="3.4" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="169.111" y="291" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">λ = 3.89 mm</text>
<text x="169.111" y="307" font-size="11" fill="#dc2626" text-anchor="start" font-weight="600">λ/2 = 1.95 mm</text>
<rect x="56" y="326" width="748" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="348" font-size="13" fill="#1e293b" text-anchor="start" font-weight="700">암산: λ[mm] ≈ 300 / f[GHz]. 실제 c 는 299.79 이므로 오차 0.07 % — 설계 감각용으로는 충분하다.</text>
<text x="74" y="367.5" font-size="12" fill="#dc2626" text-anchor="start" font-weight="600">빨간 선이 λ/2 — 배열 안테나의 표준 소자 간격이다. 24 GHz 배열의 소자 간격 6.25 mm 가 바로 이 값이다.</text>
<text x="74" y="386" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">λ 는 안테나 크기(∝ λ), 빔폭(≈ λ/D), 도플러 감도(f_d = 2v/λ) 를 한꺼번에 정한다.</text>
</svg>
