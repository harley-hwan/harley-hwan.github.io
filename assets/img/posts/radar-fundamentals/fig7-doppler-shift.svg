<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="468" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430" y="34" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">도플러 변이 — 시선 방향 성분만 보인다</text>
<circle cx="190" cy="178" r="120" fill="none" stroke="#0284c7" stroke-width="1.7"/>
<circle cx="208" cy="178" r="90" fill="none" stroke="#0284c7" stroke-width="1.7"/>
<circle cx="226" cy="178" r="60" fill="none" stroke="#0284c7" stroke-width="1.7"/>
<circle cx="244" cy="178" r="30" fill="none" stroke="#0284c7" stroke-width="1.7"/>
<circle cx="262" cy="178" r="7.5" fill="#1e293b" stroke="none" stroke-width="0"/>
<line x1="276" y1="178" x2="336" y2="178" stroke="#dc2626" stroke-width="2.6" stroke-linecap="butt" marker-end="url(#ar-red)"/>
<text x="306" y="167" font-size="13.5" fill="#dc2626" text-anchor="middle" font-weight="700">v</text>
<text x="378" y="236" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">촘촘 → f 높음</text>
<text x="124" y="82" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="700">성김 → f 낮음</text>
<text x="226" y="320" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">파원이 움직이면 앞쪽 파면이 밀린다</text>
<line x1="580" y1="132" x2="720" y2="252" stroke="#64748b" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="720" y1="252" x2="764" y2="290" stroke="#64748b" stroke-width="1.3" stroke-linecap="butt" stroke-dasharray="5 4"/>
<circle cx="720" cy="252" r="8.5" fill="#16a34a" stroke="none" stroke-width="0"/>
<text x="736" y="268" font-size="11.5" fill="#16a34a" text-anchor="start" font-weight="700">레이더</text>
<circle cx="580" cy="132" r="7" fill="#1e293b" stroke="none" stroke-width="0"/>
<text x="574" y="118" font-size="11.5" fill="#1e293b" text-anchor="start" font-weight="700">표적</text>
<line x1="580" y1="132" x2="661" y2="107" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ar-violet)"/>
<text x="672" y="102" font-size="13.5" fill="#7c3aed" text-anchor="start" font-weight="700">v</text>
<line x1="580" y1="132" x2="614" y2="161" stroke="#0284c7" stroke-width="2.5" stroke-linecap="butt" marker-end="url(#ar-sky)"/>
<line x1="661" y1="107" x2="614" y2="161" stroke="#64748b" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="4 3"/>
<text x="572" y="194" font-size="12.5" fill="#0284c7" text-anchor="middle" font-weight="700">v_r = v cos θ</text>
<path d="M620.1,119.4 A42,42 0 0 1 611.9,159.3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="640" y="146" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700">θ</text>
<text x="650" y="336" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">시선 속도만 도플러가 된다</text>
<text x="336" y="358" font-size="15.5" fill="#1e293b" text-anchor="middle" font-weight="700">f_d = 2 v_r / λ</text>
<text x="524" y="358" font-size="15.5" fill="#1e293b" text-anchor="middle" font-weight="700">v_r = f_d λ / 2</text>
<rect x="56" y="384" width="748" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="406" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">왕복이라 2 가 붙는다. 24 GHz 에서 1 m/s 는 160 Hz, 77 GHz 에서는 514 Hz — 짧은 파장이 더 민감하다.</text>
<text x="74" y="425" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">측정되는 것은 시선 속도 v_r 뿐이다. 센서를 옆으로 지나가는 성분은 도플러에 나타나지 않는다.</text>
<text x="74" y="444" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">부호(다가옴/멀어짐)를 구분하려면 실수 신호로는 부족하고 I/Q 두 채널이 필요하다 — 1 편의 주제다.</text>
</svg>
