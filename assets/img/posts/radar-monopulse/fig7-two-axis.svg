<svg width="2580" height="1500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="498" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">2차원 모노펄스 — 개구를 넷으로 나눠 세 벌을 만든다</text>
<text x="180.0" y="78.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">개구를 넷으로 나눈다</text>
<rect x="108.0" y="106.0" width="72.0" height="72.0" rx="4" fill="#2563eb" fill-opacity="0.16"/>
<rect x="108.0" y="106.0" width="72.0" height="72.0" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="144.0" y="148.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">A</text>
<rect x="180.0" y="106.0" width="72.0" height="72.0" rx="4" fill="#2563eb" fill-opacity="0.16"/>
<rect x="180.0" y="106.0" width="72.0" height="72.0" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="216.0" y="148.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">B</text>
<rect x="108.0" y="178.0" width="72.0" height="72.0" rx="4" fill="#2563eb" fill-opacity="0.16"/>
<rect x="108.0" y="178.0" width="72.0" height="72.0" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="144.0" y="220.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">C</text>
<rect x="180.0" y="178.0" width="72.0" height="72.0" rx="4" fill="#2563eb" fill-opacity="0.16"/>
<rect x="180.0" y="178.0" width="72.0" height="72.0" rx="4" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text x="216.0" y="220.0" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="700">D</text>
<line x1="92.0" y1="178.0" x2="268.0" y2="178.0" stroke="#64748b" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 3"/>
<line x1="180.0" y1="90.0" x2="180.0" y2="266.0" stroke="#64748b" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 3"/>
<text x="274.0" y="182.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">방위</text>
<text x="180.0" y="84.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">고각</text>
<text x="180.0" y="280.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">넷을 어떻게 더하고 빼느냐로</text>
<text x="180.0" y="296.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">세 벌이 한꺼번에 나온다</text>
<rect x="300.0" y="100.0" width="526.0" height="62.0" rx="7" fill="#16a34a" fill-opacity="0.09"/>
<rect x="300.0" y="100.0" width="526.0" height="62.0" rx="7" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<text x="320.0" y="126.0" font-size="12.5" fill="#16a34a" text-anchor="start" font-weight="700">합 빔  Σ</text>
<text x="470.0" y="126.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">A + B + C + D</text>
<text x="320.0" y="148.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">표적이 있느냐, 얼마나 센가</text>
<rect x="300.0" y="176.0" width="526.0" height="62.0" rx="7" fill="#2563eb" fill-opacity="0.09"/>
<rect x="300.0" y="176.0" width="526.0" height="62.0" rx="7" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<text x="320.0" y="202.0" font-size="12.5" fill="#2563eb" text-anchor="start" font-weight="700">방위 차 빔  Δaz</text>
<text x="470.0" y="202.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">(A + C) − (B + D)</text>
<text x="320.0" y="224.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">좌우 어느 쪽으로 얼마나 벗어났나</text>
<rect x="300.0" y="252.0" width="526.0" height="62.0" rx="7" fill="#ea580c" fill-opacity="0.09"/>
<rect x="300.0" y="252.0" width="526.0" height="62.0" rx="7" fill="none" stroke="#ea580c" stroke-width="1.3"/>
<text x="320.0" y="278.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">고각 차 빔  Δel</text>
<text x="470.0" y="278.0" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">(A + B) − (C + D)</text>
<text x="320.0" y="300.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400">위아래 어느 쪽으로 얼마나 벗어났나</text>
<text x="563.0" y="344.0" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="700">방위 각도 = Re(Δaz/Σ) ÷ k_m × 빔폭        고각 각도 = Re(Δel/Σ) ÷ k_m × 빔폭</text>
<rect x="34.0" y="370.0" width="792.0" height="112.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="430.0" y="394.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">두 축을 따로 재는 것이 아니라 같은 펄스에서 한꺼번에 뽑는다. 개구를 넷으로 나누기만 하면 된다.</text>
<text x="430.0" y="416.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">아날로그에서는 이 더하기와 빼기를 전용 회로망으로 짰다. 넷을 받아 셋을 내보내는 고정된 회로다.</text>
<text x="430.0" y="438.0" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">디지털이면 같은 데이터에 가중 세 벌을 곱하면 끝이라, 나누는 방식도 나중에 바꿀 수 있다.</text>
<text x="430.0" y="462.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">네 몫의 이득과 위상이 어긋나면 Σ 가 Δ 로 새어 들어가 정면이 밀린다. 그 이야기는 뒤에서 한다.</text>
</svg>
