<text x="450.0" y="436.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="700">가중을 바꾸면 빔폭과 기울기가 같이 움직인다 (SNR 20 dB)</text>
<text x="180.0" y="464.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">가중</text>
<text x="356.0" y="464.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">빔폭</text>
<text x="532.0" y="464.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">S 곡선 기울기</text>
