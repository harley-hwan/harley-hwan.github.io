<rect x="74.0" y="316.0" width="752.0" height="82.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="450.0" y="340.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">각도 오차 = 빔폭 ÷ (S 곡선 기울기 × √(2·SNR)).  빔폭이 좁을수록, 기울기가 가파를수록, 신호가 셀수록 정확하다.</text>
<text x="450.0" y="362.0" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">분해능은 빔폭에 묶여 있지만 정확도는 빔폭의 수십 분의 일까지 내려간다. 표적이 하나뿐일 때의 이야기다.</text>
<text x="450.0" y="386.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">여기서 SNR 은 펄스 압축과 적분이 다 끝난 뒤의 값이다. 적분이 SNR 을 올리면 각도도 그만큼 정확해진다.</text>
<rect x="74.0" y="410.0" width="752.0" height="146.0" rx="8" fill="#16a34a" fill-opacity="0.07"/>
