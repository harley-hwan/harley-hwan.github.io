<text x="430.0" y="508.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">고각이 빔폭의 절반(1.28°) 아래로 내려가면 상이 같은 빔 안에 들어와 갈라 볼 수 없다. 50 km 라면 고도 1120 m 다.</text>
<text x="430.0" y="530.0" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">그 아래 표적은 고각을 믿을 수 없다. 방위는 멀쩡한데 고각만 무너지는 것이 저고도 추적의 오랜 문제다.</text>
