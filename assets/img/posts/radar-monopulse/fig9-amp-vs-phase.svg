<svg width="2580" height="1632" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 544" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="542" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">진폭 비교와 위상 비교 — 무엇이 다른가</text>
<rect x="34.0" y="56.0" width="392.0" height="330.0" rx="9" fill="#2563eb" fill-opacity="0.04"/>
<rect x="34.0" y="56.0" width="392.0" height="330.0" rx="9" fill="none" stroke="#2563eb" stroke-width="1.3"/>
<text x="230.0" y="82.0" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="700">진폭 비교</text>
<text x="230.0" y="102.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">같은 자리에서 서로 다른 방향을 본다</text>
<path d="M230.0,282.0 L222.6,140.2 L156.9,160.3 Z" fill="#ea580c" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.13"/>
<line x1="230.0" y1="282.0" x2="187.3" y2="142.4" stroke="#ea580c" stroke-width="1.9" stroke-linecap="butt"/>
<text x="182.6" y="131.1" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">B</text>
<path d="M230.0,282.0 L303.1,160.3 L237.4,140.2 Z" fill="#2563eb" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.13"/>
<line x1="230.0" y1="282.0" x2="272.7" y2="142.4" stroke="#2563eb" stroke-width="1.9" stroke-linecap="butt"/>
<text x="277.4" y="131.1" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">A</text>
<line x1="230.0" y1="282.0" x2="230.0" y2="130.0" stroke="#64748b" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="5 3"/>
<text x="225.0" y="126.0" font-size="9.5" fill="#64748b" text-anchor="end" font-weight="400">정면</text>
<line x1="166.0" y1="282.0" x2="294.0" y2="282.0" stroke="#1e293b" stroke-width="3.6" stroke-linecap="butt"/>
<text x="230.0" y="302.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">개구 하나</text>
<circle cx="256.0" cy="134.0" r="5.4" fill="#dc2626"/>
<text x="266.0" y="154.0" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">표적</text>
<text x="230.0" y="352.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">표적이 A 쪽에 가까우면 A 가 세게, B 가 약하게 들어온다</text>
<text x="230.0" y="372.0" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="700">재는 것 : 두 빔의 세기 차이</text>
<rect x="434.0" y="56.0" width="392.0" height="330.0" rx="9" fill="#7c3aed" fill-opacity="0.04"/>
<rect x="434.0" y="56.0" width="392.0" height="330.0" rx="9" fill="none" stroke="#7c3aed" stroke-width="1.3"/>
<text x="630.0" y="82.0" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="700">위상 비교</text>
<text x="630.0" y="102.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">떨어진 두 자리에서 같은 방향을 본다</text>
<line x1="637.6" y1="121.2" x2="566.0" y2="282.0" stroke="#64748b" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="765.6" y1="121.2" x2="694.0" y2="282.0" stroke="#64748b" stroke-width="1.1" stroke-linecap="butt" stroke-dasharray="5 4"/>
<line x1="555.1" y1="220.2" x2="732.4" y2="299.1" stroke="#0284c7" stroke-width="2.0" stroke-linecap="butt"/>
<line x1="573.0" y1="180.0" x2="750.3" y2="258.9" stroke="#0284c7" stroke-width="2.0" stroke-linecap="butt"/>
<line x1="590.9" y1="139.8" x2="768.2" y2="218.7" stroke="#0284c7" stroke-width="2.0" stroke-linecap="butt"/>
<text x="776.2" y="222.7" font-size="10.5" fill="#0284c7" text-anchor="start" font-weight="700">파면</text>
<circle cx="765.6" cy="121.2" r="5.4" fill="#dc2626"/>
<text x="775.6" y="125.2" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="700">표적</text>
<line x1="566.0" y1="282.0" x2="587.2" y2="234.4" stroke="#dc2626" stroke-width="3.0" stroke-linecap="butt"/>
<text x="560.0" y="248.0" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">아직 남은 거리</text>
<text x="560.0" y="262.0" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">D · sinθ</text>
<line x1="534.0" y1="282.0" x2="598.0" y2="282.0" stroke="#7c3aed" stroke-width="3.6" stroke-linecap="butt"/>
<text x="566.0" y="302.0" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">A</text>
<line x1="662.0" y1="282.0" x2="726.0" y2="282.0" stroke="#0d9488" stroke-width="3.6" stroke-linecap="butt"/>
<text x="694.0" y="302.0" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="700">B</text>
<line x1="566.0" y1="316.0" x2="694.0" y2="316.0" stroke="#64748b" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#ar-mute)"/>
<line x1="566.0" y1="310.0" x2="566.0" y2="322.0" stroke="#64748b" stroke-width="1.2" stroke-linecap="butt"/>
<text x="630.0" y="332.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="700">기선  D</text>
<text x="630.0" y="352.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">같은 파면이 B 에 먼저 닿고 A 에는 늦게 닿는다</text>
<text x="630.0" y="372.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="700">재는 것 : 두 빔의 위상 차이</text>
<rect x="34.0" y="402.0" width="792.0" height="58.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="232.0" y="426.0" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">Re( Δ / Σ ) × 빔폭 ÷ 기울기 = 각도</text>
<text x="232.0" y="447.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">정면에서 0, 좌우로 부호가 갈리는 값</text>
<line x1="430.0" y1="414.0" x2="430.0" y2="450.0" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="butt"/>
<text x="628.0" y="426.0" font-size="12.5" fill="#7c3aed" text-anchor="middle" font-weight="700">Δφ = (2π / λ) · D · sinθ</text>
<text x="628.0" y="447.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">기선이 길수록 같은 각도에 크게 벌어진다</text>
<rect x="34.0" y="472.0" width="792.0" height="56.0" rx="8" fill="#16a34a" fill-opacity="0.07"/>
<rect x="34.0" y="472.0" width="792.0" height="56.0" rx="8" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<text x="430.0" y="494.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">둘 다 같은 펄스에서 두 값을 동시에 뽑는다. 그 점이 순차 로빙·원추 주사와 갈리는 자리다.</text>
<text x="430.0" y="516.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">위상 비교가 더 정확하지만 위상이 한 바퀴를 넘으면 각도를 하나로 정할 수 없다. 진폭 비교는 그 걱정이 없다.</text>
</svg>
