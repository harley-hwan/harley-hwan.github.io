<rect x="40.0" y="336.0" width="786.0" height="96.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="433.0" y="360.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">개구를 둘로 나눠 각각 합친 뒤 두 값의 위상차를 잰다. 위상차와 각도는 sinθ 로 곧장 이어진다.</text>
<text x="433.0" y="382.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">기선이 길수록 같은 각도에 위상차가 크게 벌어져 정확해진다. 대신 위상이 ±180° 를 넘는 각도가 빨리 온다.</text>
<text x="433.0" y="404.0" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">위상차가 한 바퀴를 넘으면 어느 각도인지 정할 수 없다. 기선 길이가 정확도와 맞바꾸는 값이다.</text>
<text x="433.0" y="424.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">기선을 두 배로 늘리면 정확도는 두 배가 되고 모호성 없는 구간은 ±1.5° 로 줄어든다.</text>
<rect x="40.0" y="444.0" width="786.0" height="144.0" rx="8" fill="#16a34a" fill-opacity="0.07"/>
<rect x="40.0" y="444.0" width="786.0" height="144.0" rx="8" fill="none" stroke="#16a34a" stroke-width="1.3"/>
<text x="433.0" y="468.0" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">이 배열에서 두 방식을 견주면</text>
<text x="340.0" y="492.0" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">진폭 비교</text>
<text x="580.0" y="492.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="700">위상 비교</text>
<line x1="72.0" y1="501.0" x2="794.0" y2="501.0" stroke="#16a34a" stroke-width="1.0" stroke-linecap="butt" stroke-dasharray="3 4"/>
<text x="200.0" y="520.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="700">빔폭</text>
<text x="340.0" y="520.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">2.57°</text>
<text x="580.0" y="520.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">2.57°</text>
<text x="200.0" y="539.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="700">SNR 13 dB 각도 오차</text>
<text x="340.0" y="539.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">0.302°</text>
<text x="580.0" y="539.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">0.151°</text>
<text x="200.0" y="558.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="700">SNR 20 dB 각도 오차</text>
<text x="340.0" y="558.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">0.135°</text>
<text x="580.0" y="558.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">0.067°</text>
<text x="200.0" y="577.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="700">잴 수 있는 범위</text>
<text x="340.0" y="577.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">주엽 안</text>
<text x="580.0" y="577.0" font-size="10.5" fill="#1e293b" text-anchor="middle" font-weight="400">±3.0° (그 밖은 모호)</text>
