<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 248" width="860" height="248" role="img">
<defs></defs>
<rect x="0" y="0" width="860" height="248" rx="10" fill="#FFFFFF"/>
<text x="430" y="32" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1E2329" text-anchor="middle" font-weight="700">send 를 몇 번 나눠 불렀는지는 상대에게 전달되지 않는다</text>
<rect x="24" y="48" width="240" height="120" rx="6" fill="#FFFFFF" stroke="#D9532B" stroke-width="1.5"/>
<text x="144" y="72" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" fill="#D9532B" text-anchor="middle" font-weight="700">보내는 쪽</text>
<rect x="44" y="84" width="200" height="34" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="144" y="106" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11.5" fill="#1E2329" text-anchor="middle" font-weight="400">send(sock, buf, 4, 0)</text>
<text x="144" y="140" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">4 byte 를 한 번에 넣는다</text>
<rect x="310" y="48" width="240" height="120" rx="6" fill="#F2F4F7" stroke="#C8891F" stroke-width="1.5"/>
<text x="430" y="72" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" fill="#C8891F" text-anchor="middle" font-weight="700">커널 TCP 버퍼</text>
<rect x="350" y="88" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#C8891F" stroke-width="1.2"/>
<text x="365" y="108" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#C8891F" text-anchor="middle" font-weight="700">B</text>
<rect x="386" y="88" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#C8891F" stroke-width="1.2"/>
<text x="401" y="108" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#C8891F" text-anchor="middle" font-weight="700">B</text>
<rect x="422" y="88" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#C8891F" stroke-width="1.2"/>
<text x="437" y="108" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#C8891F" text-anchor="middle" font-weight="700">B</text>
<rect x="458" y="88" width="30" height="30" rx="3" fill="#FFFFFF" stroke="#C8891F" stroke-width="1.2"/>
<text x="473" y="108" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#C8891F" text-anchor="middle" font-weight="700">B</text>
<text x="430" y="140" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">바이트로만 쌓인다 — 경계가 사라진다</text>
<rect x="596" y="48" width="240" height="120" rx="6" fill="#FFFFFF" stroke="#13757A" stroke-width="1.5"/>
<text x="716" y="72" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" fill="#13757A" text-anchor="middle" font-weight="700">받는 쪽</text>
<rect x="616" y="82" width="200" height="30" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="716" y="102" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#1E2329" text-anchor="middle" font-weight="400">recv(...,4) → 2 byte</text>
<rect x="616" y="116" width="200" height="30" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="716" y="136" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#1E2329" text-anchor="middle" font-weight="400">recv(buf+2,2) → 2 byte</text>
<text x="716" y="160" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10.5" fill="#7A828F" text-anchor="middle" font-weight="400">요청한 크기를 다 채울 때까지 반복</text>
<line x1="270" y1="108" x2="295.0" y2="108.0" stroke="#3D4451" stroke-width="1.8" stroke-linecap="round"/><path d="M 304.0 108.0 L 295.0 112.2 L 295.0 103.8 Z" fill="#3D4451"/>
<line x1="556" y1="108" x2="581.0" y2="108.0" stroke="#3D4451" stroke-width="1.8" stroke-linecap="round"/><path d="M 590.0 108.0 L 581.0 112.2 L 581.0 103.8 Z" fill="#3D4451"/>
<rect x="24" y="186" width="812" height="46" rx="6" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="430" y="205" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12" fill="#1E2329" text-anchor="middle" font-weight="700">TCP — 바이트 스트림. 프레이밍(경계 나누기)은 애플리케이션의 몫이다</text>
<text x="430" y="222" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">UDP — 데이터그램. sendto 한 번이 recvfrom 한 번으로 크기 그대로 도착한다</text>
</svg>
