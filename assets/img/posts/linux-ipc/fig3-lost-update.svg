<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 344" width="860" height="344" role="img">
<defs></defs>
<rect x="0" y="0" width="860" height="344" rx="10" fill="#FFFFFF"/>
<text x="24" y="34" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13" fill="#1E2329" text-anchor="start" font-weight="700">count++  →  mov · add · mov  세 단계</text>
<text x="24" y="54" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11.5" fill="#7A828F" text-anchor="start" font-weight="400">레지스터는 쓰레드마다 따로다. 각자 옛날 값을 손에 든 채 잘릴 수 있다.</text>
<rect x="24" y="76" width="812" height="84" rx="6" fill="#FFFFFF" stroke="#D9532B" stroke-width="1.6"/>
<text x="40" y="100" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" fill="#D9532B" text-anchor="start" font-weight="700">쓰레드 1</text>
<rect x="112" y="88" width="168" height="58" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="196" y="110" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11.5" fill="#1E2329" text-anchor="middle" font-weight="400">① mov eax,[c]</text>
<text x="196" y="130" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">eax = 5</text>
<rect x="300" y="88" width="168" height="58" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="384" y="110" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11.5" fill="#1E2329" text-anchor="middle" font-weight="400">④ add eax,1</text>
<text x="384" y="130" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">eax = 6</text>
<rect x="488" y="88" width="168" height="58" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="572" y="110" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11.5" fill="#1E2329" text-anchor="middle" font-weight="400">⑤ mov [c],eax</text>
<text x="572" y="130" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">저장</text>
<text x="760" y="122" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" fill="#D9532B" text-anchor="middle" font-weight="700">5 를 들고 있다</text>
<rect x="24" y="176" width="812" height="84" rx="6" fill="#FFFFFF" stroke="#13757A" stroke-width="1.6"/>
<text x="40" y="200" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" fill="#13757A" text-anchor="start" font-weight="700">쓰레드 2</text>
<rect x="112" y="188" width="168" height="58" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="196" y="210" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11.5" fill="#1E2329" text-anchor="middle" font-weight="400">② mov eax,[c]</text>
<text x="196" y="230" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">eax = 5</text>
<rect x="300" y="188" width="168" height="58" rx="4" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="384" y="210" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11.5" fill="#1E2329" text-anchor="middle" font-weight="400">③ add · mov</text>
<text x="384" y="230" font-family="Consolas,'D2Coding',Menlo,monospace" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">저장 → c = 6</text>
<text x="600" y="222" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">여기까지는 정상</text>
<line x1="196" y1="152" x2="196.0" y2="177.0" stroke="#7A828F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><path d="M 196.0 186.0 L 191.8 177.0 L 200.2 177.0 Z" fill="#7A828F"/>
<text x="214" y="172" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="10.5" fill="#7A828F" text-anchor="start" font-weight="400">컨텍스트 스위치</text>
<rect x="24" y="276" width="812" height="52" rx="6" fill="#F2F4F7" stroke="#D5DBE4" stroke-width="1.2"/>
<text x="430" y="300" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="12.5" fill="#1E2329" text-anchor="middle" font-weight="700">두 번 증가시켰는데 결과는 5 → 6.  ⑤ 가 ③ 의 결과를 덮어써서 한 번이 사라진다</text>
<text x="430" y="318" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="11" fill="#7A828F" text-anchor="middle" font-weight="400">lost update — 값만 틀리고 에러는 나지 않는다</text>
</svg>
