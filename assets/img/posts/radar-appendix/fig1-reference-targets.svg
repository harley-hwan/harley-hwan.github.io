<rect x="482" y="252" width="322" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="496" y="270" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">용량 유전체 렌즈</text>
<text x="496" y="288" font-size="10.8" fill="#64748b" text-anchor="start" font-weight="400">작게 큰 RCS 를 낸다</text>
<text x="792" y="278" font-size="11" fill="#64748b" text-anchor="end" font-weight="700">부양·투하 표적</text>
<rect x="34" y="336" width="792" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="54" y="360" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">구는 어느 방향에서 봐도 같은 값이라 교정에 쓰고, 코너는 크기 대비 값이 커서 표지에 쓴다.</text>
<text x="54" y="380" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">5.6 GHz 에서 변 0.30 m 짜리 삼각 삼면코너의 RCS 는 11.8 m² 다. 같은 값을 구로 내려면 지름 3.9 m 가 필요하다.</text>
<text x="54" y="400" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="700">코너는 크기의 4제곱, 구는 2제곱으로 커진다. 변을 두 배로 하면 코너는 +12 dB, 구는 +6 dB 다.</text>
<text x="54" y="420" font-size="12" fill="#1e293b" text-anchor="start" font-weight="700">코너는 파장에도 의존한다 — 같은 0.30 m 코너가 2.8 GHz 에서 +4.7 dBsm, 9.5 GHz 에서 +15.3 dBsm 이다. 구는 주파수와 무관하다.</text>
<text x="54" y="444" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">구가 그 성질을 가지려면 광학 영역에 있어야 한다 — 5.6 GHz 에서 지름 170 mm 이상, 9.5 GHz 에서 100 mm 이상이면 ka &gt; 10 이다.</text>
<text x="54" y="464" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400">값은 σ_구 = πa², σ_삼각 = 4πd⁴/3λ², σ_사각 = 12πd⁴/λ² 로 계산했다. 실물은 면 직각도와 표면 정밀도에 따라 이 값에 못 미친다.</text>
</svg>
