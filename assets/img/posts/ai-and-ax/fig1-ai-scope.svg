<rect x="1.0" y="1.0" width="858.0" height="468.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">AI 라는 말이 덮는 범위</text>
