<text x="62.0" y="86.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">인공지능(AI)</text>
<text x="62.0" y="106.0" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">사람이 규칙을 직접 쓰는 탐색·추론 프로그램까지 포함한다</text>
