<text x="182.0" y="272.0" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">파운데이션 모델</text>
<text x="182.0" y="292.0" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="400">대량의 데이터로 한 번 크게 학습해 여러 작업에 쓴다</text>
<rect x="200.0" y="308.0" width="460.0" height="102.0" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
