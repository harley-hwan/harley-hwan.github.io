<text x="431.0" y="390.0" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="400">산란점이 둘만 되어도 자세 0.06° 마다 보강과 상쇄를 오간다. 실제 표적은 수십 개라 요동이 잡음처럼 보인다.</text>
<text x="431.0" y="412.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">주파수를 c/2L = 10 MHz 옮겨도 같은 일이 일어난다. 3장의 주파수 다양성이 이 성질을 역이용한 것이다.</text>
