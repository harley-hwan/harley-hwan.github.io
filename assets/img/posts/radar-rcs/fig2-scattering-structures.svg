<svg width="2580" height="1386" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 462" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="460" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">산란의 세 구조 — 어디서 얼마나 돌아오는가</text>
<rect x="56.0" y="76.0" width="232.0" height="176.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="172.0" y="64.0" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">경면 반사 (specular)</text>
<text x="172.0" y="276.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">면이 시선과 직각일 때, 가장 세다</text>
<rect x="314.0" y="76.0" width="232.0" height="176.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="430.0" y="64.0" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">모서리 회절 (edge)</text>
<text x="430.0" y="276.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">받은 파를 원뿔면으로 다시 뿌린다</text>
<rect x="572.0" y="76.0" width="232.0" height="176.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="688.0" y="64.0" font-size="12.5" fill="#16a34a" text-anchor="middle" font-weight="700">꼭짓점 회절 (tip)</text>
<text x="688.0" y="276.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">모든 방향으로, 아주 약하게</text>
<line x1="206.0" y1="102.0" x2="206.0" y2="226.0" stroke="#dc2626" stroke-width="3.2" stroke-linecap="butt"/>
<line x1="82.0" y1="124.0" x2="200.0" y2="124.0" stroke="#2563eb" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="200.0" y1="132.0" x2="86.0" y2="132.0" stroke="#ea580c" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<line x1="82.0" y1="164.0" x2="200.0" y2="164.0" stroke="#2563eb" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="200.0" y1="172.0" x2="86.0" y2="172.0" stroke="#ea580c" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<line x1="82.0" y1="204.0" x2="200.0" y2="204.0" stroke="#2563eb" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="200.0" y1="212.0" x2="86.0" y2="212.0" stroke="#ea580c" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<text x="118.0" y="112.0" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="700">입사</text>
<text x="118.0" y="226.0" font-size="10.5" fill="#ea580c" text-anchor="middle" font-weight="700">반사</text>
<path d="M514.0,118.0 L444.0,168.0 L514.0,218.0" fill="none" stroke="#ea580c" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="340.0" y1="168.0" x2="438.0" y2="168.0" stroke="#2563eb" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="444.0" y1="168.0" x2="404.2" y2="134.6" stroke="#ea580c" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<line x1="444.0" y1="168.0" x2="393.8" y2="154.5" stroke="#ea580c" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<line x1="444.0" y1="168.0" x2="393.8" y2="181.5" stroke="#ea580c" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<line x1="444.0" y1="168.0" x2="404.2" y2="201.4" stroke="#ea580c" stroke-width="1.2" stroke-linecap="butt" marker-end="url(#ar-orange)"/>
<text x="452.0" y="110.0" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="700">쐐기 (wedge)</text>
<path d="M776.0,134.0 L702.0,168.0 L776.0,202.0 Z" fill="#16a34a" stroke="#16a34a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.1"/>
<line x1="598.0" y1="168.0" x2="696.0" y2="168.0" stroke="#2563eb" stroke-width="1.5" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="702.0" y1="168.0" x2="688.3" y2="130.4" stroke="#16a34a" stroke-width="1.1" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<line x1="702.0" y1="168.0" x2="671.4" y2="142.3" stroke="#16a34a" stroke-width="1.1" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<line x1="702.0" y1="168.0" x2="662.6" y2="161.1" stroke="#16a34a" stroke-width="1.1" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<line x1="702.0" y1="168.0" x2="664.4" y2="181.7" stroke="#16a34a" stroke-width="1.1" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<line x1="702.0" y1="168.0" x2="676.3" y2="198.6" stroke="#16a34a" stroke-width="1.1" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<rect x="56.0" y="306.0" width="748.0" height="136.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="430.0" y="330.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">구조가 곡률을 잃을수록 세지고, 주파수 의존이 f² 쪽으로 옮겨 간다 (Knott 의 정리)</text>
<text x="128.0" y="366.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">평판·코너</text>
<text x="128.0" y="390.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">σ ∝ f²</text>
<text x="128.0" y="412.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">정면에서 가장 세다</text>
<line x1="190.0" y1="386.0" x2="216.0" y2="386.0" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<text x="280.0" y="366.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="700">원통 (단일 곡면)</text>
<text x="280.0" y="390.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">σ ∝ f¹</text>
<text x="280.0" y="412.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">축과 직각일 때</text>
<line x1="342.0" y1="386.0" x2="368.0" y2="386.0" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<text x="432.0" y="366.0" font-size="11.5" fill="#7c3aed" text-anchor="middle" font-weight="700">구 (이중 곡면)</text>
<text x="432.0" y="390.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">σ ∝ f⁰</text>
<text x="432.0" y="412.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">방향과 무관</text>
<line x1="494.0" y1="386.0" x2="520.0" y2="386.0" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<text x="584.0" y="366.0" font-size="11.5" fill="#0284c7" text-anchor="middle" font-weight="700">직선 모서리</text>
<text x="584.0" y="390.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">σ ∝ f⁰</text>
<text x="584.0" y="412.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">모서리와 직각일 때</text>
<line x1="646.0" y1="386.0" x2="672.0" y2="386.0" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-axis)"/>
<text x="736.0" y="366.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="700">팁</text>
<text x="736.0" y="390.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">σ ∝ f⁻²</text>
<text x="736.0" y="412.0" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400">λ² 수준으로 약하다</text>
<text x="430.0" y="434.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">강한 것부터 약한 것 순서. 스텔스 설계는 이 사다리를 왼쪽에서 오른쪽으로 내려가는 일이다</text>
</svg>
