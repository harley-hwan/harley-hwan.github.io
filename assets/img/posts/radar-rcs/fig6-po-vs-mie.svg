<text x="441.0" y="410.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="400">PO 는 광학 영역의 평균은 맞추지만, 그림자 쪽을 도는 크리핑파가 없어 진동을 만들지 못한다.</text>
<text x="441.0" y="432.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">정해가 있는 구로 근사법의 적용 한계를 확인하는 것이 해석 검증의 첫 단계다.</text>
