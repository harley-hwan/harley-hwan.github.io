<svg width="2580" height="1536" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 512" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
<defs><marker id="ar-mute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ar-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ar-axis" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="ar-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0284c7"/></marker></defs>
<rect x="1" y="1" width="858" height="510" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
<text x="430.0" y="34.0" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="700">스텔스 형상 설계의 네 가지 기법</text>
<rect x="56.0" y="76.0" width="356.0" height="150.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="234.0" y="66.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">경사 (cant)</text>
<text x="234.0" y="248.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">수직면을 기울여 경면 반사를 위협 방향 밖으로 보낸다</text>
<rect x="448.0" y="76.0" width="356.0" height="150.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="626.0" y="66.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">모서리 정렬 (alignment)</text>
<text x="626.0" y="248.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">앞전·뒷전·패널선의 각도를 몇 개로 통일해 회절 방향을 몰아넣는다</text>
<rect x="56.0" y="298.0" width="356.0" height="150.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="234.0" y="288.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">톱니 (serration)</text>
<text x="234.0" y="470.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">이음매를 톱니로 잘라 회절을 정렬된 방향으로 돌린다</text>
<rect x="448.0" y="298.0" width="356.0" height="150.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="626.0" y="288.0" font-size="12.5" fill="#1e293b" text-anchor="middle" font-weight="700">S 형 흡기구 (S-duct)</text>
<text x="626.0" y="470.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">압축기 블레이드를 시선에서 가려 공진강 반사를 없앤다</text>
<line x1="152.0" y1="106.0" x2="152.0" y2="200.0" stroke="#dc2626" stroke-width="3.0" stroke-linecap="butt"/>
<line x1="86.0" y1="153.0" x2="146.0" y2="153.0" stroke="#2563eb" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="146.0" y1="146.0" x2="90.0" y2="146.0" stroke="#dc2626" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-red)"/>
<text x="152.0" y="216.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="400">수직: 그대로 되돌아간다</text>
<line x1="306.0" y1="110.0" x2="342.0" y2="200.0" stroke="#16a34a" stroke-width="3.0" stroke-linecap="butt"/>
<line x1="242.0" y1="153.0" x2="316.0" y2="153.0" stroke="#2563eb" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-blue)"/>
<line x1="318.0" y1="148.0" x2="356.0" y2="110.0" stroke="#16a34a" stroke-width="1.4" stroke-linecap="butt" marker-end="url(#ar-green)"/>
<text x="314.0" y="216.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="400">경사: 다른 방향으로 보낸다</text>
<line x1="508.0" y1="116.0" x2="560.2" y2="110.4" stroke="#dc2626" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="508.0" y1="142.0" x2="549.4" y2="128.1" stroke="#dc2626" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="508.0" y1="168.0" x2="530.8" y2="148.4" stroke="#dc2626" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="508.0" y1="194.0" x2="517.4" y2="172.7" stroke="#dc2626" stroke-width="2.2" stroke-linecap="butt"/>
<text x="536.0" y="214.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="400">제각각: 플래시가 사방에</text>
<line x1="678.0" y1="116.0" x2="732.0" y2="102.0" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="678.0" y1="142.0" x2="732.0" y2="128.0" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="678.0" y1="168.0" x2="732.0" y2="154.0" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt"/>
<line x1="678.0" y1="194.0" x2="732.0" y2="180.0" stroke="#16a34a" stroke-width="2.2" stroke-linecap="butt"/>
<text x="710.0" y="214.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="400">정렬: 몇 개 방향에만</text>
<line x1="96.0" y1="358.0" x2="216.0" y2="358.0" stroke="#dc2626" stroke-width="2.4" stroke-linecap="butt"/>
<text x="156.0" y="342.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="400">직선 이음매</text>
<path d="M252.0,394.0 L276.0,374.0 L300.0,394.0 L324.0,374.0 L348.0,394.0 L372.0,374.0" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="312.0" y="420.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="400">톱니 이음매 (정렬된 각도로)</text>
<path d="M488.0,354.0 L598.0,354.0" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M488.0,382.0 L598.0,382.0" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
