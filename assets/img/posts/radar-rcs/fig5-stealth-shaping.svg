<text x="544.0" y="406.0" font-size="9.5" fill="#dc2626" text-anchor="middle" font-weight="400">직선: 블레이드가 보인다</text>
<path d="M644.0,354.0 L688.0,354.0 L720.0,382.0 L764.0,382.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M644.0,382.0 L684.0,382.0 L716.0,410.0 L764.0,410.0" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="770.0" cy="396.0" r="13" fill="none" stroke="#16a34a" stroke-width="2.2"/>
<text x="708.0" y="434.0" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="400">S 형: 직접 보이지 않는다</text>
</svg>
